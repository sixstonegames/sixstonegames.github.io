G.LOC["en"] = {"버려진 제단":"Abandoned Altar","먼지 쌓인 제단 위에 녹슨 잔이 놓여 있다. 잔 바닥엔 마른 핏자국이 엉겨 붙어 있다.":"A rusted chalice sits on a dusty altar. Dried blood cakes its bottom.","피를 바친다 (체력 -8)":"Offer blood (HP -8)","잔이 피를 삼키더니, 제단 아래 숨겨진 칸이 열린다.":"The chalice drank the blood, and a hidden drawer slid open beneath the altar.","그냥 지나간다":"Walk past","등 뒤에서 무언가 아쉬워하는 소리가 들린 것 같다.":"Something behind you seemed to sigh in disappointment.","떠돌이 상인":"Wandering Peddler","등이 굽은 상인이 보따리를 푼다. \"싸게 줄게… 딱 하나만. 뭐가 들었는지는 나도 몰라.\"":"A hunched peddler unties his bundle. \"Cheap… just one. Even I don't know what's inside.\"","30골드에 상자를 산다":"Buy a box for 30 Gold","상자 안에 쓸 만한 물건이 들어 있다.":"Something useful was inside the box.","상자 안의 물건이 손에 달라붙는다. 상인은 이미 사라졌다.":"The thing inside stuck to your hand. The peddler was already gone.","거절한다":"Refuse","\"후회할걸…\" 상인이 어둠 속으로 사라진다.":"\"You'll regret it…\" The peddler vanished into the dark.","검은 샘":"Black Spring","검은 물이 고인 샘. 수면 아래에서 희미한 빛이 새어 나온다.":"A spring of still black water. Faint light seeps from beneath the surface.","물을 마신다":"Drink the water","차가운 물이 상처를 메운다.":"The cold water closed your wounds.","입안이 썩는 맛으로 가득 찬다.":"Your mouth filled with the taste of rot.","병에 담아 간다":"Bottle it","빈 병에 검은 물을 담았다. 약으로 쓸 수 있을 것 같다.":"You filled an empty flask with black water. It might serve as medicine.","해골 더미":"Bone Pile","누군가의 유품이 해골 더미 아래 깔려 있다. 손을 넣으면 닿을 것 같다.":"Someone's belongings lie buried under a pile of bones. You could reach them.","뒤진다":"Search it","낡은 주머니에서 금화가 쏟아진다.":"Coins spilled from an old pouch.","쓸 만한 물건을 찾았다.":"You found something useful.","해골 더미가 덜그럭거리며 일어선다!":"The bones rattled and rose!","명복을 빈다":"Pray for the dead","잠시 눈을 감았다. 어딘가에서 작은 빛이 스며든다.":"You closed your eyes a moment. A small light seeped in from somewhere.","사슬 묶인 상자":"Chained Chest","검은 사슬로 칭칭 감긴 상자. 가까이 가자 속삭임이 들린다. \"열어… 열어…\"":"A chest wrapped tight in black chains. As you near, it whispers: \"Open… open…\"","사슬을 끊고 연다":"Break the chains","금화와 함께, 불길한 물건 하나가 손에 감긴다.":"Along with the gold, something ominous coiled around your hand.","무시한다":"Ignore it","속삭임이 점점 멀어진다.":"The whispers faded away.","늙은 용병의 유령":"Old Mercenary's Ghost","투구를 쓴 유령이 칼을 겨눈다. \"한 수 겨뤄보겠나? 살아남으면 요령 하나 알려주지.\"":"A helmed ghost raises its blade. \"Care for a bout? Survive, and I'll teach you a trick.\"","겨룬다 (체력 -10)":"Spar (HP -10)","\"나쁘지 않군.\" 유령이 무기 다루는 법을 알려준다.":"\"Not bad.\" The ghost showed you how to handle your weapon.","이야기만 듣는다":"Just listen to his tales","유령의 무용담을 들었다.":"You listened to the ghost's war stories.","잠든 파수꾼":"Sleeping Sentinel","거대한 파수꾼이 보물 상자를 끌어안고 잠들어 있다. 코 고는 소리가 벽을 울린다.":"A giant sentinel sleeps hugging a treasure chest. Its snores shake the walls.","몰래 훔친다":"Steal quietly","숨죽인 채 금화를 한 움큼 챙겼다.":"Holding your breath, you grabbed a fistful of gold.","파수꾼의 눈이 번쩍 뜨인다!":"The sentinel's eyes snapped open!","조용히 지나간다":"Sneak past","발끝으로 조심조심 지나갔다.":"You tiptoed carefully past.","깨진 거울":"Broken Mirror","금 간 거울 속의 내가 웃고 있다. 나는 웃고 있지 않은데.":"Your reflection in the cracked mirror is smiling. You are not.","거울에 손을 뻗는다":"Reach into the mirror","거울 속의 내가 무언가를 건넨다.":"Your reflection handed you something.","거울 속 손이 내 손목을 할퀸다.":"A hand in the mirror clawed your wrist.","거울을 깨뜨린다":"Shatter the mirror","파편이 흩어진다. 몸을 짓누르던 무언가도 함께 부서진 것 같다.":"Shards scattered. Something weighing on you seemed to shatter with them.","피의 계약서":"Blood Contract","공중에 양피지가 떠 있다. \"그대의 생명을 조금 내놓으면, 힘을 주마.\"":"A parchment floats in the air. \"Give me a little of your life, and I'll give you power.\"","서명한다 (최대 체력 -8)":"Sign it (Max HP -8)","손끝에서 피가 흘러 이름이 새겨진다. 몸 안에서 무언가 깨어난다.":"Blood ran from your fingertip to write your name. Something woke within you.","찢어버린다":"Tear it up","양피지가 비명을 지르며 재가 된다.":"The parchment shrieked and turned to ash.","떠난다":"Leave","다친 순례자":"Wounded Pilgrim","피 흘리는 순례자가 벽에 기대 앉아 있다. \"물… 물 좀…\"":"A bleeding pilgrim slumps against the wall. \"Water… some water…\"","상처를 돌봐준다 (체력 -4)":"Tend his wounds (HP -4)","순례자가 축복을 내린다. \"그대의 길에 빛이 있기를.\"":"The pilgrim blessed you. \"May light be on your path.\"","짐을 빼앗는다":"Take his belongings","금화를 챙겼다. 마음이 무겁다.":"You pocketed the gold. Your heart felt heavy.","버려진 대장간":"Abandoned Forge","아직 불씨가 살아 있는 화로. 모루 위에 망치가 놓여 있다.":"The hearth still holds live embers. A hammer rests on the anvil.","아이템을 손본다":"Work on an item","망치질 소리가 어둠 속에 울려 퍼진다.":"Hammer blows rang out through the dark.","불씨 옆에서 쉰다":"Rest by the embers","따뜻한 온기에 몸이 풀린다.":"The warmth eased your body.","쥐구멍":"Rat Hole","벽의 구멍 안쪽에서 무언가 반짝인다. 찍찍거리는 소리도 들린다.":"Something glints inside a hole in the wall. You hear squeaking.","손을 넣는다":"Reach inside","반짝이는 물건을 꺼냈다!":"You pulled out something shiny!","이빨이 손가락을 파고든다!":"Teeth sank into your fingers!","찍찍 소리가 비웃는 것 같다.":"The squeaking sounded like mocking laughter.","이름 없는 성소":"Nameless Shrine","다가가자 촛불들이 저절로 켜진다. 누구를 위한 성소인지는 알 수 없다.":"Candles light themselves as you approach. Whom this shrine serves, none can say.","기도한다":"Pray","따스한 빛이 몸을 감싼다.":"Warm light wrapped around you.","25골드를 바친다":"Offer 25 Gold","촛불이 푸르게 타오른다. 새로운 깨달음이 찾아온다.":"The candles burned blue. A new insight came to you.","눈물 흘리는 석상":"Weeping Statue","석상의 눈에서 붉은 눈물이 흐른다. 이마에는 커다란 보석이 박혀 있다.":"Red tears flow from the statue's eyes. A great gem is set in its brow.","눈물을 받아 마신다":"Drink the tears","쇠 맛이 난다. 몸이 조금 단단해진 느낌이다.":"They tasted of iron. You felt a little sturdier.","보석을 캐낸다":"Pry out the gem","보석을 챙겼다. 석상의 시선이 등에 꽂힌다.":"You took the gem. The statue's gaze bored into your back.","매달린 시체":"Hanged Corpse","천장에 매달린 시체의 주머니가 불룩하다. 밧줄이 삐걱거린다.":"A corpse hangs from the ceiling, its pockets bulging. The rope creaks.","주머니를 턴다":"Empty its pockets","금화를 챙겼다.":"You took the gold.","시체의 눈이 번쩍 뜨인다!":"The corpse's eyes snapped open!","내려서 묻어준다":"Cut it down and bury it","작은 무덤을 만들어줬다.":"You made a small grave.","무너진 서가":"Collapsed Bookshelf","곰팡이 핀 책들 사이로 금박 표지 한 권이 눈에 띈다.":"Among moldy books, one gilded cover catches your eye.","그 자리에서 읽는다":"Read it here","오래된 전투 기록이다. 많은 것을 배웠다.":"An old battle record. You learned a great deal.","금지된 글자가 눈을 파고든다.":"Forbidden letters burned into your eyes.","책을 챙긴다":"Take the book","책 사이에서 마법 물건을 찾았다.":"You found a magic item between the pages.","영혼의 우물":"Well of Souls","우물 속에서 수많은 목소리가 울린다. 이름을 부르는 것 같다.":"Countless voices echo from the well. They seem to call your name.","목소리에 귀 기울인다 (체력 -6)":"Listen to the voices (HP -6)","망자들이 비밀을 속삭인다.":"The dead whispered their secrets.","뚜껑을 덮는다":"Close the lid","목소리가 뚝 끊긴다.":"The voices cut off abruptly.","파헤쳐진 무덤":"Unearthed Grave","누군가 무덤을 파다 말았다. 흙더미 위에 삽이 꽂혀 있다.":"Someone left a grave half dug. A shovel stands in the dirt pile.","마저 판다":"Finish digging","관 속에서 부장품을 찾았다.":"You found grave goods in the coffin.","관 뚜껑이 안에서 열린다!":"The coffin lid opened from inside!","흙을 덮어준다":"Fill it back in","무덤을 정리해줬다. 마음이 가벼워진다.":"You tidied the grave. Your heart felt lighter.","묘지기의 오두막":"Gravekeeper's Hut","불 꺼진 오두막. 식탁 위에 식은 수프가 놓여 있다. 주인은 보이지 않는다.":"A dark hut. Cold soup sits on the table. The owner is nowhere to be seen.","잠시 쉰다":"Rest a while","낡은 침대에서 눈을 붙였다.":"You caught some sleep on an old bed.","서랍을 뒤진다":"Search the drawers","묘지기의 비상금을 찾았다.":"You found the gravekeeper's secret stash.","뼈로 만든 종":"Bone Bell","바람 한 점 없는데 뼈로 만든 종이 흔들린다.":"There's no wind, yet a bell made of bone sways.","종을 울린다":"Ring the bell","종소리가 망자들을 움츠러들게 한다.":"The toll made the dead cower.","종소리에 무언가 깨어났다!":"The toll woke something!","종을 떼어 간다":"Take the bell","묵직한 종을 챙겼다.":"You took the heavy bell.","까마귀 떼":"Crow Flock","까마귀 떼가 반짝이는 반지를 서로 빼앗으려 다투고 있다.":"A flock of crows squabbles over a glittering ring.","빵 부스러기를 던진다 (10골드)":"Toss breadcrumbs (10 Gold)","까마귀들이 반지를 떨어뜨리고 빵에 달려든다.":"The crows dropped the ring and dove for the bread.","쫓아낸다":"Chase them off","부리에 쪼였지만 떨어진 금화를 주웠다.":"You got pecked, but picked up some dropped gold.","떠내려온 뗏목":"Drifting Raft","썩은 물 위로 뗏목이 떠내려온다. 짐 꾸러미가 묶여 있다.":"A raft drifts over the rotten water. A bundle is tied to it.","물에 뛰어들어 잡는다":"Dive in and grab it","짐 꾸러미를 건졌다!":"You hauled in the bundle!","더러운 물을 잔뜩 삼켰다.":"You swallowed a mouthful of filthy water.","장대로 끌어당긴다":"Pull it in with a pole","꾸러미는 떨어졌지만 뗏목에서 금화를 찾았다.":"The bundle fell off, but you found gold on the raft.","빛나는 버섯밭":"Glowing Mushrooms","푸르게 빛나는 버섯들이 벽을 뒤덮고 있다. 달큰한 냄새가 난다.":"Blue-glowing mushrooms cover the walls. They smell sickly sweet.","하나 먹어본다":"Eat one","몸에 힘이 차오른다!":"Strength surged through you!","속이 뒤집힌다.":"Your stomach turned.","채집해 간다":"Gather some","약초로 쓸 만한 버섯을 챙겼다.":"You took mushrooms fit for herbal medicine.","물에 잠긴 상자":"Sunken Chest","탁한 물 바닥에 상자가 가라앉아 있다. 숨을 오래 참아야 한다.":"A chest lies at the bottom of murky water. You'll have to hold your breath a long time.","잠수한다 (체력 -9)":"Dive (HP -9)","숨이 끊어지기 직전, 상자를 열었다.":"On the verge of drowning, you pried the chest open.","갈고리를 던진다":"Throw a grappling hook","상자 조각에 걸린 물건을 건졌다.":"You snagged an item from the chest's wreckage.","갈고리가 허탕을 쳤다.":"The hook came up empty.","역병 환자의 천막":"Plague Tent","기침 소리가 가득한 천막. 약 상자가 구석에 쌓여 있다.":"A tent full of coughing. Medicine crates are piled in a corner.","환자들을 돌본다 (체력 -6)":"Tend the sick (HP -6)","환자들이 고맙다며 기도를 올린다.":"The sick offered prayers of thanks.","약을 훔친다":"Steal medicine","귀한 영약을 찾았다! 하지만 병이 옮았다.":"You found a rare elixir! But you caught the sickness.","물약을 챙겼다. 하지만 병이 옮았다.":"You grabbed a potion. But you caught the sickness.","고해실":"Confessional","커튼 너머에서 낮은 목소리가 들린다. \"죄를 고하라.\"":"A low voice speaks from behind the curtain. \"Confess your sins.\"","진심으로 고해한다":"Confess truly","무거운 것이 몸에서 빠져나간다.":"Something heavy left your body.","거짓을 고한다":"Confess lies","커튼 너머에서 웃음소리. 금화 주머니와 함께 무언가가 따라온다.":"Laughter behind the curtain. A purse of gold came to you, and something followed it.","성유물함":"Reliquary","유리관 속에 성유물이 잠들어 있다. 관은 금이 가 있다.":"A holy relic sleeps in a glass case. The case is cracked.","유리를 깨고 취한다 (체력 -10)":"Smash the glass (HP -10)","유리 조각에 베였지만, 성유물은 내 것이다.":"The shards cut you, but the relic was yours.","성유물 앞에 기도한다":"Pray before the relic","성스러운 빛이 상처를 씻어낸다.":"Holy light washed your wounds clean.","어둠의 성가":"Dark Hymn","보이지 않는 성가대가 노래한다. 가사가 머릿속을 파고든다.":"An unseen choir sings. The words burrow into your mind.","따라 부른다 (체력 -8)":"Sing along (HP -8)","피가 끓어오른다.":"Your blood boiled.","귀를 막고 지나간다":"Cover your ears and pass","무사히 지나쳤다.":"You passed by unharmed.","노랫소리가 뼛속까지 스민다.":"The song seeped into your bones.","빈 주교좌":"Empty Bishop's Throne","황금으로 된 주교좌가 비어 있다. 앉으면 무언가를 얻을 것만 같다.":"A golden bishop's throne sits empty. Sitting in it might bring you something.","앉는다":"Sit","힘이 흘러들어온다. 그리고 무언가가 손에 쥐어진다.":"Power flowed into you. Then something was pressed into your hand.","금박을 벗겨낸다":"Strip the gold leaf","주머니가 두둑해졌다.":"Your purse grew heavy.","핏빛 분수":"Blood Fountain","분수에서 물 대신 끈적한 피가 솟는다. 바닥에 금화가 반짝인다.":"Thick blood gushes from the fountain instead of water. Coins glint at the bottom.","금화를 줍는다":"Pick up the coins","손이 붉게 물들었지만 금화는 진짜다.":"Your hands were stained red, but the gold was real.","피가 손목을 타고 올라온다.":"Blood crept up your wrists.","피를 한 모금 마신다":"Drink a sip of blood","뜨거운 기운이 혈관을 채운다.":"Searing heat filled your veins.","길 잃은 아이의 유령":"Lost Child's Ghost","작은 유령이 울고 있다. \"엄마를 찾아줘…\"":"A small ghost is crying. \"Help me find my mommy…\"","손을 잡아준다":"Hold its hand","유령이 웃으며 빛으로 흩어진다. 따뜻한 기운이 남는다.":"The ghost smiled and scattered into light, leaving a lingering warmth.","모른 척한다":"Pretend not to see","울음소리가 한참 동안 등 뒤에서 따라온다.":"The crying followed you for a long while.","무너진 무기고":"Collapsed Armory","녹슨 무기들이 산처럼 쌓여 있다. 쓸 만한 게 하나쯤은 있을지도.":"Rusted weapons lie heaped like a mountain. Something here might still be usable.","무기를 고른다":"Pick a weapon","그럭저럭 쓸 만한 것을 찾았다.":"You found something serviceable.","숫돌로 내 무기를 간다":"Hone your weapon","날이 한결 날카로워졌다.":"The edge grew noticeably sharper.","은둔자":"Hermit","누더기를 걸친 노인이 모닥불 앞에 앉아 있다. \"이야기를 들어주면, 가르침을 주지.\"":"An old man in rags sits by a campfire. \"Hear my tale, and I'll teach you something.\"","이야기를 듣는다":"Hear his tale","긴 이야기 끝에 노인이 한 가지 비결을 알려준다.":"After a long tale, the old man shared a secret.","불을 나눠 쓴다":"Share the fire","말없이 불을 쬐며 쉬었다.":"You rested by the fire in silence.","수상한 발판":"Suspicious Tile","바닥 한가운데 눈에 띄게 다른 발판이 있다. 건너편에 상자가 보인다.":"One tile in the middle of the floor looks clearly different. A chest waits on the far side.","뛰어넘는다":"Leap over it","가볍게 착지했다. 상자는 내 것이다.":"You landed lightly. The chest was yours.","칼날이 튀어나와 다리를 벤다!":"Blades sprang out and slashed your legs!","돌아간다":"Turn back","안전이 제일이다.":"Safety first.","유령 상인":"Ghost Merchant","반투명한 상인이 가방을 연다. \"돈은 필요 없어. 기억을 조금만 줘.\"":"A translucent merchant opens his bag. \"I don't want coin. Just a few memories.\"","기억을 판다 (경험치 -20)":"Sell memories (XP -20)","무언가 잊은 것 같지만, 손에는 귀한 물건이 들려 있다.":"You felt you'd forgotten something, but a precious item was in your hand.","\"아쉽군…\" 상인이 연기처럼 사라진다.":"\"Pity…\" The merchant vanished like smoke.","작은 뼈 제단":"Small Bone Altar","누군가 뼈로 작은 제단을 쌓았다. 제단 위 해골이 이쪽을 보는 것 같다.":"Someone built a small altar of bones. The skull on top seems to watch you.","가장 하찮은 물건을 바친다":"Offer your weakest item","해골의 눈에 불이 켜진다. 바친 것 대신 다른 물건이 손에 쥐어진다.":"Fire kindled in the skull's eyes. In place of your offering, something else was pressed into your hand.","제단을 무너뜨린다":"Topple the altar","뼈 사이에서 금화가 굴러 나온다.":"Coins rolled out from among the bones.","제단을 지키던 것이 어둠 속에서 달려든다!":"The altar's guardian lunged from the dark!","속삭이는 벽":"Whispering Wall","벽에 수백 개의 이름이 새겨져 있다. 그중 하나가 내 이름이다.":"Hundreds of names are carved into the wall. One of them is yours.","이름을 지운다":"Erase your name","손톱으로 긁어 이름을 지웠다. 죽음이 한 걸음 물러난 것 같다.":"You scratched your name away with your nails. Death seemed to step back.","다른 이름들을 읽는다":"Read the other names","먼저 간 자들의 기록에서 배운다.":"You learned from the records of those who went before.","봉인된 문":"Sealed Door","사슬과 부적으로 봉인된 작은 문. 안에서 긁는 소리가 난다.":"A small door sealed with chains and talismans. Something scratches inside.","봉인을 뜯는다":"Tear off the seals","문이 열리자 정예 괴물이 튀어나온다! 뒤쪽에 보물이 보인다.":"The door opened and an elite monster burst out! Treasure glinted behind it.","문틈의 꾸러미만 챙긴다":"Take only the bundle G.LOC["ja"] = {"버려진 제단":"打ち捨てられた祭壇","먼지 쌓인 제단 위에 녹슨 잔이 놓여 있다. 잔 바닥엔 마른 핏자국이 엉겨 붙어 있다.":"埃をかぶった祭壇に錆びた杯が置かれている。杯の底には乾いた血がこびりついている。","피를 바친다 (체력 -8)":"血を捧げる (HP -8)","잔이 피를 삼키더니, 제단 아래 숨겨진 칸이 열린다.":"杯が血を飲み干すと、祭壇の下の隠し棚が開いた。","그냥 지나간다":"そのまま通り過ぎる","등 뒤에서 무언가 아쉬워하는 소리가 들린 것 같다.":"背後で何かが残念がる声が聞こえた気がする。","떠돌이 상인":"流れの行商人","등이 굽은 상인이 보따리를 푼다. \"싸게 줄게… 딱 하나만. 뭐가 들었는지는 나도 몰라.\"":"腰の曲がった商人が包みを広げる。「安くしとくよ…一つだけな。中身はわしも知らん」","30골드에 상자를 산다":"30ゴールドで箱を買う","상자 안에 쓸 만한 물건이 들어 있다.":"箱の中には使えそうな物が入っていた。","상자 안의 물건이 손에 달라붙는다. 상인은 이미 사라졌다.":"箱の中身が手に張りついて離れない。商人はもう消えていた。","거절한다":"断る","\"후회할걸…\" 상인이 어둠 속으로 사라진다.":"「後悔するぞ…」商人は闇の中へ消えていった。","검은 샘":"黒い泉","검은 물이 고인 샘. 수면 아래에서 희미한 빛이 새어 나온다.":"黒い水をたたえた泉。水面の下から微かな光が漏れている。","물을 마신다":"水を飲む","차가운 물이 상처를 메운다.":"冷たい水が傷を塞いでいく。","입안이 썩는 맛으로 가득 찬다.":"口の中が腐った味で満たされる。","병에 담아 간다":"瓶に汲んでいく","빈 병에 검은 물을 담았다. 약으로 쓸 수 있을 것 같다.":"空き瓶に黒い水を汲んだ。薬として使えそうだ。","해골 더미":"骸骨の山","누군가의 유품이 해골 더미 아래 깔려 있다. 손을 넣으면 닿을 것 같다.":"誰かの遺品が骸骨の山の下敷きになっている。手を入れれば届きそうだ。","뒤진다":"漁る","낡은 주머니에서 금화가 쏟아진다.":"古びた巾着から金貨がこぼれ落ちる。","쓸 만한 물건을 찾았다.":"使えそうな物を見つけた。","해골 더미가 덜그럭거리며 일어선다!":"骸骨の山がガラガラと音を立てて起き上がる！","명복을 빈다":"冥福を祈る","잠시 눈을 감았다. 어딘가에서 작은 빛이 스며든다.":"しばし目を閉じた。どこからか小さな光が差し込んでくる。","사슬 묶인 상자":"鎖に縛られた箱","검은 사슬로 칭칭 감긴 상자. 가까이 가자 속삭임이 들린다. \"열어… 열어…\"":"黒い鎖で幾重にも巻かれた箱。近づくと囁き声が聞こえる。「開けて…開けて…」","사슬을 끊고 연다":"鎖を断ち切って開ける","금화와 함께, 불길한 물건 하나가 손에 감긴다.":"金貨とともに、不吉な何かが手に絡みつく。","무시한다":"無視する","속삭임이 점점 멀어진다.":"囁き声が次第に遠ざかっていく。","늙은 용병의 유령":"老傭兵の亡霊","투구를 쓴 유령이 칼을 겨눈다. \"한 수 겨뤄보겠나? 살아남으면 요령 하나 알려주지.\"":"兜をかぶった亡霊が剣を向ける。「一手手合わせ願おうか？生き延びたらコツを一つ教えてやろう」","겨룬다 (체력 -10)":"手合わせする (HP -10)","\"나쁘지 않군.\" 유령이 무기 다루는 법을 알려준다.":"「悪くないな」亡霊が武器の扱い方を教えてくれる。","이야기만 듣는다":"話だけ聞く","유령의 무용담을 들었다.":"亡霊の武勇伝を聞いた。","잠든 파수꾼":"眠れる番人","거대한 파수꾼이 보물 상자를 끌어안고 잠들어 있다. 코 고는 소리가 벽을 울린다.":"巨大な番人が宝箱を抱えて眠っている。いびきが壁を震わせる。","몰래 훔친다":"こっそり盗む","숨죽인 채 금화를 한 움큼 챙겼다.":"息を殺して金貨をひとつかみ手に入れた。","파수꾼의 눈이 번쩍 뜨인다!":"番人の目がカッと見開かれる！","조용히 지나간다":"静かに通り過ぎる","발끝으로 조심조심 지나갔다.":"つま先立ちでそろりと通り過ぎた。","깨진 거울":"割れた鏡","금 간 거울 속의 내가 웃고 있다. 나는 웃고 있지 않은데.":"ひび割れた鏡の中の自分が笑っている。自分は笑っていないのに。","거울에 손을 뻗는다":"鏡に手を伸ばす","거울 속의 내가 무언가를 건넨다.":"鏡の中の自分が何かを差し出してくる。","거울 속 손이 내 손목을 할퀸다.":"鏡の中の手が手首を引っ掻いた。","거울을 깨뜨린다":"鏡を割る","파편이 흩어진다. 몸을 짓누르던 무언가도 함께 부서진 것 같다.":"破片が飛び散る。身体にのしかかっていた何かも一緒に砕けた気がする。","피의 계약서":"血の契約書","공중에 양피지가 떠 있다. \"그대의 생명을 조금 내놓으면, 힘을 주마.\"":"宙に羊皮紙が浮かんでいる。「汝の命を少し差し出せば、力を授けよう」","서명한다 (최대 체력 -8)":"署名する (最大HP -8)","손끝에서 피가 흘러 이름이 새겨진다. 몸 안에서 무언가 깨어난다.":"指先から血が流れ、名が刻まれる。身体の奥で何かが目覚める。","찢어버린다":"破り捨てる","양피지가 비명을 지르며 재가 된다.":"羊皮紙が悲鳴を上げて灰になる。","떠난다":"立ち去る","다친 순례자":"傷ついた巡礼者","피 흘리는 순례자가 벽에 기대 앉아 있다. \"물… 물 좀…\"":"血を流す巡礼者が壁にもたれて座り込んでいる。「水を…水をくれ…」","상처를 돌봐준다 (체력 -4)":"傷の手当てをする (HP -4)","순례자가 축복을 내린다. \"그대의 길에 빛이 있기를.\"":"巡礼者が祝福を授ける。「汝の道に光のあらんことを」","짐을 빼앗는다":"荷物を奪う","금화를 챙겼다. 마음이 무겁다.":"金貨を手に入れた。心が重い。","버려진 대장간":"打ち捨てられた鍛冶場","아직 불씨가 살아 있는 화로. 모루 위에 망치가 놓여 있다.":"まだ火種の残る炉。金床の上に槌が置かれている。","아이템을 손본다":"アイテムを手入れする","망치질 소리가 어둠 속에 울려 퍼진다.":"槌を打つ音が闇に響き渡る。","불씨 옆에서 쉰다":"火種のそばで休む","따뜻한 온기에 몸이 풀린다.":"温もりに身体がほぐれていく。","쥐구멍":"ネズミの穴","벽의 구멍 안쪽에서 무언가 반짝인다. 찍찍거리는 소리도 들린다.":"壁の穴の奥で何かが光っている。チューチューという鳴き声も聞こえる。","손을 넣는다":"手を突っ込む","반짝이는 물건을 꺼냈다!":"光る物を引っ張り出した！","이빨이 손가락을 파고든다!":"歯が指に食い込む！","찍찍 소리가 비웃는 것 같다.":"チューチューという声が嘲笑っているようだ。","이름 없는 성소":"名もなき聖所","다가가자 촛불들이 저절로 켜진다. 누구를 위한 성소인지는 알 수 없다.":"近づくと蝋燭がひとりでに灯る。誰のための聖所なのかはわからない。","기도한다":"祈る","따스한 빛이 몸을 감싼다.":"温かな光が身体を包み込む。","25골드를 바친다":"25ゴールドを捧げる","촛불이 푸르게 타오른다. 새로운 깨달음이 찾아온다.":"蝋燭が青く燃え上がる。新たな悟りが訪れる。","눈물 흘리는 석상":"涙を流す石像","석상의 눈에서 붉은 눈물이 흐른다. 이마에는 커다란 보석이 박혀 있다.":"石像の目から赤い涙が流れている。額には大きな宝石が埋め込まれている。","눈물을 받아 마신다":"涙を受けて飲む","쇠 맛이 난다. 몸이 조금 단단해진 느낌이다.":"鉄の味がする。身体が少し頑丈になった気がする。","보석을 캐낸다":"宝石をえぐり取る","보석을 챙겼다. 석상의 시선이 등에 꽂힌다.":"宝石を手に入れた。石像の視線が背中に突き刺さる。","매달린 시체":"吊るされた死体","천장에 매달린 시체의 주머니가 불룩하다. 밧줄이 삐걱거린다.":"天井から吊るされた死体のポケットが膨らんでいる。縄がギシギシと軋む。","주머니를 턴다":"ポケットを漁る","금화를 챙겼다.":"金貨を手に入れた。","시체의 눈이 번쩍 뜨인다!":"死体の目がカッと見開かれる！","내려서 묻어준다":"降ろして埋葬する","작은 무덤을 만들어줬다.":"小さな墓を作ってやった。","무너진 서가":"崩れた書架","곰팡이 핀 책들 사이로 금박 표지 한 권이 눈에 띈다.":"黴びた本の間に、金箔の表紙の一冊が目に留まる。","그 자리에서 읽는다":"その場で読む","오래된 전투 기록이다. 많은 것을 배웠다.":"古い戦闘の記録だ。多くを学んだ。","금지된 글자가 눈을 파고든다.":"禁じられた文字が目に食い込む。","책을 챙긴다":"本を持っていく","책 사이에서 마법 물건을 찾았다.":"本の間から魔法の品を見つけた。","영혼의 우물":"魂の井戸","우물 속에서 수많은 목소리가 울린다. 이름을 부르는 것 같다.":"井戸の中から無数の声が響く。名を呼んでいるようだ。","목소리에 귀 기울인다 (체력 -6)":"声に耳を傾ける (HP -6)","망자들이 비밀을 속삭인다.":"亡者たちが秘密を囁く。","뚜껑을 덮는다":"蓋を閉める","목소리가 뚝 끊긴다.":"声がぷつりと途絶える。","파헤쳐진 무덤":"掘り返された墓","누군가 무덤을 파다 말았다. 흙더미 위에 삽이 꽂혀 있다.":"誰かが墓を掘りかけてやめている。土の山にはシャベルが突き立っている。","마저 판다":"続きを掘る","관 속에서 부장품을 찾았다.":"棺の中から副葬品を見つけた。","관 뚜껑이 안에서 열린다!":"棺の蓋が内側から開く！","흙을 덮어준다":"土をかけてやる","무덤을 정리해줬다. 마음이 가벼워진다.":"墓を整えてやった。心が軽くなる。","묘지기의 오두막":"墓守の小屋","불 꺼진 오두막. 식탁 위에 식은 수프가 놓여 있다. 주인은 보이지 않는다.":"灯りの消えた小屋。食卓には冷めたスープが置かれている。主の姿は見えない。","잠시 쉰다":"しばし休む","낡은 침대에서 눈을 붙였다.":"古びた寝台でひと眠りした。","서랍을 뒤진다":"引き出しを漁る","묘지기의 비상금을 찾았다.":"墓守のへそくりを見つけた。","뼈로 만든 종":"骨の鐘","바람 한 점 없는데 뼈로 만든 종이 흔들린다.":"風もないのに、骨でできた鐘が揺れている。","종을 울린다":"鐘を鳴らす","종소리가 망자들을 움츠러들게 한다.":"鐘の音に亡者たちが縮み上がる。","종소리에 무언가 깨어났다!":"鐘の音で何かが目覚めた！","종을 떼어 간다":"鐘を外して持っていく","묵직한 종을 챙겼다.":"ずっしりと重い鐘を手に入れた。","까마귀 떼":"カラスの群れ","까마귀 떼가 반짝이는 반지를 서로 빼앗으려 다투고 있다.":"カラスの群れが光る指輪を奪い合っている。","빵 부스러기를 던진다 (10골드)":"パンくずを投げる (10ゴールド)","까마귀들이 반지를 떨어뜨리고 빵에 달려든다.":"カラスたちは指輪を落とし、パンに群がる。","쫓아낸다":"追い払う","부리에 쪼였지만 떨어진 금화를 주웠다.":"くちばしで突かれたが、落ちた金貨を拾った。","떠내려온 뗏목":"流れ着いた筏","썩은 물 위로 뗏목이 떠내려온다. 짐 꾸러미가 묶여 있다.":"腐った水の上を筏が流れてくる。荷物の包みが括りつけられている。","물에 뛰어들어 잡는다":"水に飛び込んで掴む","짐 꾸러미를 건졌다!":"荷物の包みを引き上げた！","더러운 물을 잔뜩 삼켰다.":"汚れた水をたっぷり飲み込んだ。","장대로 끌어당긴다":"竿で引き寄せる","꾸러미는 떨어졌지만 뗏목에서 금화를 찾았다.":"包みは落ちたが、筏の上で金貨を見つけた。","빛나는 버섯밭":"光るキノコの群生地","푸르게 빛나는 버섯들이 벽을 뒤덮고 있다. 달큰한 냄새가 난다.":"青く光るキノコが壁を覆い尽くしている。甘ったるい匂いがする。","하나 먹어본다":"一つ食べてみる","몸에 힘이 차오른다!":"身体に力がみなぎる！","속이 뒤집힌다.":"胃がひっくり返る。","채집해 간다":"採集していく","약초로 쓸 만한 버섯을 챙겼다.":"薬草として使えそうなキノコを手に入れた。","물에 잠긴 상자":"沈んだ箱","탁한 물 바닥에 상자가 가라앉아 있다. 숨을 오래 참아야 한다.":"濁った水の底に箱が沈んでいる。長く息を止める必要がありそうだ。","잠수한다 (체력 -9)":"潜る (HP -9)","숨이 끊어지기 직전, 상자를 열었다.":"息が尽きる寸前、箱をこじ開けた。","갈고리를 던진다":"鉤縄を投げる","상자 조각에 걸린 물건을 건졌다.":"箱の残骸に引っかかった物を引き上げた。","갈고리가 허탕을 쳤다.":"鉤縄は空振りに終わった。","역병 환자의 천막":"疫病患者の天幕","기침 소리가 가득한 천막. 약 상자가 구석에 쌓여 있다.":"咳の音が満ちる天幕。隅には薬箱が積まれている。","환자들을 돌본다 (체력 -6)":"患者たちを看病する (HP -6)" G.LOC["zh-Hant"] = {"버려진 제단":"廢棄祭壇","먼지 쌓인 제단 위에 녹슨 잔이 놓여 있다. 잔 바닥엔 마른 핏자국이 엉겨 붙어 있다.":"積滿灰塵的祭壇上放著一只生鏽的杯子，杯底凝著乾涸的血跡。","피를 바친다 (체력 -8)":"獻上鮮血（生命-8）","잔이 피를 삼키더니, 제단 아래 숨겨진 칸이 열린다.":"杯子吞下鮮血，祭壇下方的暗格隨之開啟。","그냥 지나간다":"直接走過","등 뒤에서 무언가 아쉬워하는 소리가 들린 것 같다.":"身後似乎傳來一聲惋惜的嘆息。","떠돌이 상인":"流浪商人","등이 굽은 상인이 보따리를 푼다. \"싸게 줄게… 딱 하나만. 뭐가 들었는지는 나도 몰라.\"":"駝背的商人解開包袱。「算你便宜……只賣一個。裡面裝什麼，我也不知道。」","30골드에 상자를 산다":"花30金幣買一個箱子","상자 안에 쓸 만한 물건이 들어 있다.":"箱子裡有件還算堪用的東西。","상자 안의 물건이 손에 달라붙는다. 상인은 이미 사라졌다.":"箱中之物黏在手上甩不掉。商人早已不見蹤影。","거절한다":"拒絕","\"후회할걸…\" 상인이 어둠 속으로 사라진다.":"「你會後悔的……」商人消失在黑暗中。","검은 샘":"黑泉","검은 물이 고인 샘. 수면 아래에서 희미한 빛이 새어 나온다.":"一汪積滿黑水的泉。水面下透出微弱的光。","물을 마신다":"喝下泉水","차가운 물이 상처를 메운다.":"冰冷的泉水撫平了傷口。","입안이 썩는 맛으로 가득 찬다.":"滿嘴都是腐爛的味道。","병에 담아 간다":"裝瓶帶走","빈 병에 검은 물을 담았다. 약으로 쓸 수 있을 것 같다.":"你把黑水裝進空瓶，或許能當藥用。","해골 더미":"骸骨堆","누군가의 유품이 해골 더미 아래 깔려 있다. 손을 넣으면 닿을 것 같다.":"某人的遺物被壓在骸骨堆底下，伸手似乎就能搆到。","뒤진다":"翻找","낡은 주머니에서 금화가 쏟아진다.":"破舊的錢袋裡倒出一堆金幣。","쓸 만한 물건을 찾았다.":"找到了有用的東西。","해골 더미가 덜그럭거리며 일어선다!":"骸骨堆喀啦作響地站了起來！","명복을 빈다":"為死者祈福","잠시 눈을 감았다. 어딘가에서 작은 빛이 스며든다.":"你閉上眼片刻，不知從何處滲進一絲微光。","사슬 묶인 상자":"纏鎖寶箱","검은 사슬로 칭칭 감긴 상자. 가까이 가자 속삭임이 들린다. \"열어… 열어…\"":"被黑色鎖鏈層層纏繞的箱子。一靠近就聽見低語：「打開……打開……」","사슬을 끊고 연다":"斬斷鎖鏈打開","금화와 함께, 불길한 물건 하나가 손에 감긴다.":"除了金幣，還有一件不祥之物纏上了你的手。","무시한다":"無視","속삭임이 점점 멀어진다.":"低語聲漸漸遠去。","늙은 용병의 유령":"老傭兵的幽魂","투구를 쓴 유령이 칼을 겨눈다. \"한 수 겨뤄보겠나? 살아남으면 요령 하나 알려주지.\"":"戴著頭盔的幽魂舉劍相向。「比劃一下如何？活下來，就教你一招。」","겨룬다 (체력 -10)":"比試（生命-10）","\"나쁘지 않군.\" 유령이 무기 다루는 법을 알려준다.":"「還不賴。」幽魂傳授你使用武器的訣竅。","이야기만 듣는다":"只聽他說故事","유령의 무용담을 들었다.":"你聽完了幽魂的英勇事蹟。","잠든 파수꾼":"沉睡的守衛","거대한 파수꾼이 보물 상자를 끌어안고 잠들어 있다. 코 고는 소리가 벽을 울린다.":"巨大的守衛抱著寶箱沉睡，鼾聲震動著牆壁。","몰래 훔친다":"偷偷摸走","숨죽인 채 금화를 한 움큼 챙겼다.":"你屏住呼吸，抓了一把金幣。","파수꾼의 눈이 번쩍 뜨인다!":"守衛猛然睜開雙眼！","조용히 지나간다":"安靜地走過","발끝으로 조심조심 지나갔다.":"你踮著腳尖小心走過。","깨진 거울":"破碎的鏡子","금 간 거울 속의 내가 웃고 있다. 나는 웃고 있지 않은데.":"裂開的鏡中，我正在笑。可我明明沒有笑。","거울에 손을 뻗는다":"把手伸進鏡中","거울 속의 내가 무언가를 건넨다.":"鏡中的我遞來了某樣東西。","거울 속 손이 내 손목을 할퀸다.":"鏡中的手抓傷了我的手腕。","거울을 깨뜨린다":"打破鏡子","파편이 흩어진다. 몸을 짓누르던 무언가도 함께 부서진 것 같다.":"碎片四散，壓在身上的某種東西似乎也一同粉碎了。","피의 계약서":"血之契約","
