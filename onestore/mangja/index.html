:root{
  color-scheme: dark;
  --ground:#0e0c12; --panel:#17141d; --panel2:#1e1a25; --line:#2a2530; --line2:#3a3342;
  --text:#ddd4df; --dim:#b3abbb; --faint:#8a8295;
  --blood:#b3313a; --blood2:#7a1f24; --gold:#f0c65a; --soul:#6fd3c9; --heal:#8fd06a; --block:#8fc3e8; --poison:#a3c95a; --curse:#c46be0;
  --r-c:#a9a2b0; --r-u:#5fa8e8; --r-r:#b77ce8; --r-l:#f0b93a; --r-x:#d0413f;
  --f-disp:'Song Myung', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --f-ui: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --f-num: 'Silkscreen', ui-monospace, 'SFMono-Regular', monospace;
  --ts: 1;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--ground);color:var(--text);font-family:var(--f-ui);font-size:calc(17px * var(--ts));-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;overflow:hidden;}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--ground);}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
button{font-family:inherit;color:inherit;}
.num{font-family:var(--f-num);letter-spacing:0;font-variant-numeric:tabular-nums;}
.disp{font-family:var(--f-disp);font-weight:400;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;background:linear-gradient(#141119,#0e0c12);border-bottom:1px solid var(--line);flex:none;}
.top .hp{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
.bar{position:relative;height:14px;background:#22131a;border:1px solid #000;border-radius:2px;overflow:hidden;flex:1;}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#d0454e,#8a222b);transition:width .25s steps(6);}
.bar.blue i{background:linear-gradient(#8fc3e8,#4a6a94);}
.bar s{position:absolute;top:0;bottom:0;background:#ffe9a8;opacity:.75;animation:pvb .8s steps(2) infinite;}
@keyframes pvb{50%{opacity:.35}}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:calc(13px * var(--ts)) var(--f-num);color:#fff;text-shadow:1px 1px 0 #000;}
.bar .shield{position:absolute;right:2px;top:0;bottom:0;display:flex;align-items:center;gap:1px;font:calc(13px * var(--ts)) var(--f-num);color:var(--block);}
.chip{display:flex;align-items:center;gap:4px;font:calc(14.5px * var(--ts)) var(--f-num);color:var(--gold);white-space:nowrap;}
.chip.soul{color:var(--soul);}
.iconbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;width:34px;height:30px;display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--ts));cursor:pointer;flex:none;}
.xp{height:3px;background:#1a1720;flex:none;}
.xp i{display:block;height:100%;background:var(--soul);transition:width .3s;}
.sub{display:flex;justify-content:space-between;padding:4px 16px;font-size:calc(13px * var(--ts));color:var(--dim);flex:none;}

/* ---------- scene ---------- */
.scene{flex:1;position:relative;overflow:hidden;min-height:0;display:flex;flex-direction:column;}
.scene::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 35%, var(--zb1,#1a1622) 0%, var(--zb2,#0e0c12) 70%);z-index:0;}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.35;z-index:0;}
.scene > *{position:relative;z-index:1;}
.floor{position:absolute!important;left:0;right:0;bottom:0;height:26%;background:linear-gradient(transparent,var(--zg,#2a2530) 40%,#0b090e);z-index:0!important;}
.dust{position:absolute!important;inset:0;pointer-events:none;z-index:0!important;}
.dust i{position:absolute;width:2px;height:2px;background:#cfc3d6;opacity:.25;animation:drift 9s linear infinite;}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-120px);opacity:0}}

/* ---------- battle ---------- */
.eArea{display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;flex:1;justify-content:center;min-height:0;}
.intent{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0b090ef0;border:1px solid var(--line2);border-left-width:3px;border-radius:6px;padding:5px 12px 6px;min-width:120px;max-width:86%;position:relative;cursor:help;}
.intent:after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--line2);border-bottom:0;}
.intent .ih{display:flex;align-items:center;gap:6px;font-weight:700;}
.intent .ik{font-size:calc(14.5px * var(--ts));opacity:.9;}
.intent .iv{font:calc(20px * var(--ts)) var(--f-num);line-height:1;}
.intent .iv.sm{font:700 calc(17px * var(--ts)) var(--f-ui);}
.intent .itot{font:calc(15.5px * var(--ts)) var(--f-num);opacity:.75;}
.intent .isub{font-size:calc(13px * var(--ts));color:var(--text);opacity:.85;text-align:center;line-height:1.35;}
.intent .leth{margin-left:2px;font-size:calc(13px * var(--ts));font-weight:700;color:#fff;background:var(--blood);border-radius:3px;padding:1px 5px;}
.intent.atk{color:#ff9a8a;border-color:#6a2530;border-left-color:#e0603a;} .intent.blk{color:var(--block);border-left-color:var(--block);} .intent.buf{color:#f0a060;border-left-color:#f0a060;}
.intent.deb{color:var(--curse);border-left-color:var(--curse);} .intent.heal{color:var(--heal);border-left-color:var(--heal);} .intent.stun{color:var(--gold);border-left-color:var(--gold);}
.intent.big{border-color:var(--blood);box-shadow:0 0 12px #b3313a88;}
.intent.lethal{border-color:#ff5a4a;box-shadow:0 0 16px #ff5a4aaa;animation:pulse 1s steps(2) infinite;}
@keyframes pulse{50%{box-shadow:0 0 2px #b3313a44}}
.enemyWrap{position:relative;display:flex;justify-content:center;align-items:flex-end;}
.enemyWrap .glow{position:absolute;bottom:-4px;width:70%;height:14px;border-radius:50%;background:#00000088;filter:blur(2px);}
.enemy{filter:drop-shadow(0 0 1px #cfc3d655) drop-shadow(0 0 8px #cfc3d622);}
.enemy.p2{filter:drop-shadow(0 0 2px #ff5a4a) drop-shadow(0 0 14px #b3313aaa) saturate(1.3);}
.idle{animation:bob 1.1s steps(2) infinite;}
@keyframes bob{50%{transform:translateY(calc(var(--u,4px) * -1))}}
.ename{font-family:var(--f-disp);font-size:calc(17px * var(--ts));display:flex;gap:6px;align-items:center;}
.tag{font:calc(13px * var(--ts)) var(--f-ui);font-weight:700;padding:1px 5px;border-radius:3px;background:var(--blood2);color:#fff;}
.tag.g{background:#3a3050;color:#c9b8ee;} .tag.b{background:#6a4a10;color:var(--gold);}
.ebar{width:66%;max-width:260px;}
.sts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px;}
.st{display:flex;align-items:center;gap:3px;background:#0b090ee0;border:1px solid var(--line2);border-radius:10px;padding:1px 7px 1px 3px;font:calc(13px * var(--ts)) var(--f-num);cursor:help;color:var(--text);}
.st b{font:700 calc(13px * var(--ts)) var(--f-ui);}
.st.neg{border-color:#6a2530;background:#1f0d11e8;}
.st.pos{border-color:#2f5a55;background:#0d1d1be8;}
.st.s-poison b{color:var(--poison);} .st.s-bleed b{color:#ff6a6a;} .st.s-weak b{color:#b8a8c8;} .st.s-vuln b{color:#f0a060;} .st.s-stun b{color:var(--gold);}
.st.s-str b{color:#f0a060;} .st.s-regen b{color:var(--heal);} .st.s-dodge b{color:var(--soul);}
.pArea{display:flex;align-items:center;gap:10px;padding:6px 16px 8px;}
.pArea .pinfo{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
.pname{font-size:calc(14.5px * var(--ts));color:var(--dim);display:flex;justify-content:space-between;}
.log{margin:0 16px 6px;min-height:36px;font-size:calc(14.5px * var(--ts));color:var(--dim);line-height:1.5;}
.log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.log p:last-child{color:var(--text);}

.fx{position:absolute;inset:0;pointer-events:none;z-index:20!important;}
.fxc{position:absolute!important;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;z-index:19!important;}
.fnum{position:absolute;font:bold calc(18px * var(--ts)) var(--f-num);color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:fup .9s ease-out forwards;white-space:nowrap;transform:translateX(-50%);}
.fnum.p{color:#ff7a6a;} .fnum.h{color:var(--heal);} .fnum.b{color:var(--block);font-size:calc(15.5px * var(--ts));} .fnum.s{font:bold calc(14.5px * var(--ts)) var(--f-ui);color:#f0d0ff;} .fnum.big{font-size:calc(26px * var(--ts));color:var(--gold);}
@keyframes fup{0%{opacity:0;margin-top:6px}15%{opacity:1;margin-top:-6px}100%{opacity:0;margin-top:-46px}}
.flash{animation:flash .18s steps(2);}
@keyframes flash{50%{filter:brightness(4) saturate(0)}}
.shake{animation:shake .25s steps(4);}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.lunge{animation:lunge .3s steps(3);}
@keyframes lunge{50%{transform:translateY(16px) scale(1.06)}}
.sshake{animation:sshake .3s steps(5);}
@keyframes sshake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.dying{animation:die .6s steps(6) forwards;}
.gone{opacity:.18;filter:grayscale(1) brightness(.6);animation:none!important;}
@keyframes die{to{opacity:0;transform:translateY(12px);filter:brightness(3) saturate(0)}}

/* ---------- panel / bag ---------- */
.panel{flex:none;background:linear-gradient(#1a1620,#121016);border-top:2px solid #000;box-shadow:0 -1px 0 var(--line2) inset;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;}
.ptitle{display:flex;justify-content:space-between;font-size:calc(13px * var(--ts));color:var(--dim);letter-spacing:.04em;}
.bag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.slot{position:relative;background:#0f0d13;border:1px solid var(--line2);border-radius:4px;min-height:58px;display:flex;align-items:center;gap:6px;padding:5px 6px;cursor:pointer;overflow:hidden;text-align:left;}
.slot.empty{border-style:dashed;opacity:.5;justify-content:center;font-size:calc(13px * var(--ts));color:var(--faint);}
.slot img{flex:none;}
.slot .nm{font-size:calc(14px * var(--ts));line-height:1.25;min-width:0;display:flex;flex-direction:column;}
.slot .nm b{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;line-height:1.2;}
.slot .nm small{font-size:calc(13px * var(--ts));color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot .up{position:absolute;bottom:2px;left:4px;font:calc(13px * var(--ts)) var(--f-num);color:var(--gold);background:#000c;padding:0 2px;border-radius:2px;}
.slot .uses{position:absolute;bottom:2px;right:4px;font:calc(13px * var(--ts)) var(--f-num);color:var(--text);background:#000a;padding:0 2px;border-radius:2px;}
.slot.cursed{border-color:#5a2030;box-shadow:inset 0 0 10px #d0413f33;}
.slot.pas{cursor:help;}
.slot.pas .nm small{color:var(--soul);}
.slot.cd{filter:grayscale(1) brightness(.55);}
.slot .cdn{position:absolute;left:4px;top:50%;width:34px;margin-top:-14px;height:28px;display:flex;align-items:center;justify-content:center;font:calc(20px * var(--ts)) var(--f-num);color:#fff;text-shadow:2px 2px 0 #000;}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 12px #f0c65a44;background:#1d1a14;}
.slot.used{animation:flash .2s steps(2);}
.slot.free::before{content:'무료';position:absolute;top:2px;right:4px;font-size:calc(13px * var(--ts));color:var(--soul);}
.bag4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.bag5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.bag4 .slot,.bag5 .slot{flex-direction:column;justify-content:center;gap:2px;padding:6px 3px 5px;text-align:center;min-height:74px;}
.bag5 .slot{min-height:56px;padding:4px 2px;}
.bag4 .slot .nm,.bag5 .slot .nm{align-items:center;width:100%;}
.bag4 .slot .nm b,.bag5 .slot .nm b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;max-width:100%;font-size:calc(13px * var(--ts));line-height:1.15;}
.bag4 .slot .nm small{display:none;}
.bag5 .slot .nm b{font-size:calc(13px * var(--ts));}
.bag5 .slot .nm small{display:none;}
.bag5 .slot img{width:24px!important;height:24px!important;}
.bag4 .slot.empty,.bag5 .slot.empty{font-size:calc(13px * var(--ts));line-height:1.3;}
.bag4 .slot .cdn{left:50%;top:8px;margin:0 0 0 -17px;}
.slot .wtag{position:absolute;top:2px;left:3px;font-size:calc(13px * var(--ts));color:var(--gold);}
.slot.dim{opacity:.35;pointer-events:none;}
.consrow{display:grid;grid-template-columns:1fr 1fr 1fr 1.05fr;gap:6px;}
.consrow.c3{grid-template-columns:repeat(3,1fr);}
.consrow .slot{min-height:44px;padding:3px 5px;gap:4px;}
.consrow .slot img{width:24px!important;height:24px!important;}
.consrow .slot .nm b{-webkit-line-clamp:2;font-size:calc(13px * var(--ts));}
.consrow .slot .nm small{display:none;}
.consrow .slot.empty{font-size:calc(13px * var(--ts));}
.consrow .btn{min-height:44px;padding:4px;font-size:calc(14.5px * var(--ts));}
.relics{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center;min-height:30px;padding:3px 6px;background:#0b090e;border:1px solid var(--line);border-radius:4px;cursor:pointer;}
.relics .ri{position:relative;display:inline-flex;border-radius:3px;padding:1px;}
.relics .ri i{position:absolute;right:-2px;bottom:-3px;font:calc(13px * var(--ts)) var(--f-num);font-style:normal;color:var(--gold);}
.relics .ri.cursed{box-shadow:0 0 0 1px #d0413f;}
.relics .ri.pick{outline:1px dashed var(--gold);cursor:pointer;}
.relics .ri.sel{box-shadow:0 0 0 2px var(--gold);}
.relics .ri.dim{opacity:.35;}
.relics .lbl{font-size:calc(13px * var(--ts));color:var(--dim);margin-right:2px;}
.relics .sep{width:1px;height:18px;background:var(--line2);margin:0 3px;}
.relics .more{margin-left:auto;font-size:calc(13px * var(--ts));color:var(--faint);}
.relics.picking{cursor:default;gap:6px;max-height:84px;overflow-y:auto;}
.relics .eqpart,.relics .relpart{display:flex;align-items:center;gap:3px 4px;cursor:pointer;flex-wrap:wrap;}
.relics .relpart{flex:1;min-width:0;}
.topstrip .relics .relpart{flex-wrap:nowrap;overflow:hidden;}
#pSpr{cursor:pointer;}
.topstrip{flex:none;padding:4px 12px;background:#0e0c12;border-bottom:1px solid var(--line);}
.topstrip .relics{border:none;background:none;padding:0 2px;min-height:28px;flex-wrap:nowrap;overflow:hidden;}
.topstrip .relics .more{flex:none;font-size:calc(15.5px * var(--ts));color:var(--dim);padding-left:6px;}
.bag4.big .slot{min-height:84px;}
.bag4.big .slot .nm b{font-size:calc(14.5px * var(--ts));}
.relics.picking .ri{padding:3px;}
.rowbtns{display:flex;gap:6px;}
.btn{flex:1;background:linear-gradient(#2a2430,#1c1822);border:1px solid var(--line2);border-bottom-color:#000;border-radius:4px;padding:11px 10px;font-size:calc(17px * var(--ts));font-weight:700;cursor:pointer;color:var(--text);min-height:44px;}
.btn:active{transform:translateY(1px);}
.btn.pri{background:linear-gradient(#c43c46,#8a222b);border-color:#d0545d;color:#fff;}
.btn.gold{background:linear-gradient(#6a5418,#3e3010);border-color:#a08030;color:var(--gold);}
.btn.ghost{background:transparent;}
.btn[disabled]{opacity:.4;pointer-events:none;}
.btn small{display:block;font-weight:400;font-size:calc(13px * var(--ts));color:var(--dim);margin-top:2px;}
.btn.pri small{color:#ffd0d0;}
.preview{background:#0b090e;border:1px solid var(--line2);border-radius:4px;padding:8px 10px;font-size:calc(14.5px * var(--ts));line-height:1.5;min-height:52px;}
.preview .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:calc(15.5px * var(--ts));}
.preview .h .num{color:#ff9a8a;font-size:calc(17px * var(--ts));}
.preview.muted{color:var(--dim);display:flex;align-items:center;}

/* ---------- map ---------- */
.maphead{text-align:center;padding:14px 16px 4px;}
.maphead h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:calc(22px * var(--ts));letter-spacing:.02em;}
.maphead p{margin:4px 0 0;font-size:calc(14.5px * var(--ts));color:var(--dim);}
.track{display:flex;gap:4px;justify-content:center;align-items:center;padding:6px 16px;}
.track i{width:14px;height:6px;background:#2a2530;border-radius:1px;}
.track i.done{background:#6a5f78;} .track i.now{background:var(--gold);box-shadow:0 0 6px var(--gold);}
.track img{margin-left:2px;}
.doors{flex:1;display:flex;gap:10px;justify-content:center;align-items:center;padding:8px 16px;}
.door{flex:1;max-width:var(--dw, min(140px, calc(var(--vh, 1vh) * 18)));display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0;}
.arch{width:100%;aspect-ratio:3/4.2;max-width:100%;border-radius:50% 50% 4px 4px/34% 34% 4px 4px;background:linear-gradient(#08060a,#15111b 60%,#1f1a26);border:3px solid #3d3548;box-shadow:inset 0 0 0 3px #0b090e,inset 0 -30px 40px #000,0 6px 0 #0b090e;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .12s;}
.door .arch img{filter:drop-shadow(0 0 6px #00000099);}
.door.sel .arch{border-color:var(--gold);box-shadow:inset 0 0 0 3px #0b090e,inset 0 -30px 40px #000,0 0 18px #f0c65a55;transform:translateY(-3px);}
.door.k-boss .arch{border-color:#8a2a30;background:linear-gradient(#1a0608,#2a0e12);}
.door.k-grave .arch{border-color:#5a4a78;background:linear-gradient(#0e0a16,#1e1830);}
.door.k-elite .arch{border-color:#6a3040;}
.door .lbl{font-family:var(--f-disp);font-size:calc(16px * var(--ts));}
.door .go{font-size:calc(13px * var(--ts));color:var(--gold);min-height:14px;}
.door .ds{font-size:calc(13px * var(--ts));color:var(--dim);text-align:center;line-height:1.35;min-height:30px;}
.heroMap{display:flex;justify-content:center;padding-bottom:8px;}
.bossWarn{margin:0 16px 8px;padding:8px 10px;border:1px solid #5a2030;background:#1a0a0e;border-radius:4px;font-size:calc(14.5px * var(--ts));color:#ffb0a8;display:flex;align-items:center;gap:8px;}

/* ---------- cards / modals ---------- */
.stage{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.stage > .btn, .stage > .rowbtns, .stage > .cards, .stage > .event{flex:none;}
.stage h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:calc(24px * var(--ts));text-align:center;text-wrap:balance;}
.stage .lead{margin:0;text-align:center;color:var(--dim);font-size:calc(15.5px * var(--ts));line-height:1.5;}
.cards{display:flex;flex-direction:column;gap:8px;}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:10px;cursor:pointer;text-align:left;width:100%;}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.card .ic{flex:none;background:#0b090e;border:1px solid var(--line);border-radius:4px;padding:4px;}
.card .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.card .t{font-weight:700;font-size:calc(17px * var(--ts));display:flex;justify-content:space-between;gap:6px;}
.card .t .rr{font-size:calc(13px * var(--ts));font-weight:700;}
.card .t .tags{display:flex;align-items:center;gap:5px;flex:none;}
.catb{display:inline-block;font-size:calc(13px * var(--ts));font-weight:700;line-height:1;padding:3px 6px;border-radius:9px;border:1px solid;white-space:nowrap;}
.catb.c-w{color:#ffb08a;border-color:#7a3a24;background:#2a140e;} .catb.c-s{color:#8fc3e8;border-color:#2b4a6a;background:#0e1822;}
.catb.c-c{color:#a3d98a;border-color:#3d5a2c;background:#111c0e;} .catb.c-a{color:#c9c2cf;border-color:#4a4452;background:#1a181e;}
.catb.c-t{color:#f0c65a;border-color:#6a5418;background:#1f190a;} .catb.c-r{color:#d0a0f0;border-color:#5a3a78;background:#1a1024;}
.card .l{font-size:calc(14.5px * var(--ts));line-height:1.45;color:var(--text);}
.card .l.meta{color:var(--dim);} .card .l.pas{color:var(--soul);} .card .l.curse{color:#ff8a8a;} .card .l.off{text-decoration:line-through;opacity:.6;}
.card.locked{opacity:.55;}
.card .price{font:calc(14.5px * var(--ts)) var(--f-num);color:var(--gold);white-space:nowrap;}
.card[disabled]{opacity:.45;pointer-events:none;}
.event{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.event .art{display:flex;justify-content:center;padding:6px;background:radial-gradient(#221c2a,transparent 70%);}
.event .story{font-family:var(--f-disp);font-size:calc(16px * var(--ts));line-height:1.65;margin:0;}
.event .res{font-size:calc(15.5px * var(--ts));line-height:1.6;color:var(--text);}
.event .fxl{display:flex;flex-wrap:wrap;gap:6px;}
.event .fxl span{font-size:calc(13px * var(--ts));background:#0b090e;border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--gold);}
.choice{text-align:left;}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.center > .btn{flex:none;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:calc(14.5px * var(--ts));color:var(--dim);display:flex;justify-content:space-between;}
.stats b{font:calc(14.5px * var(--ts)) var(--f-num);color:var(--text);}
.tip{background:#1a1420;border:1px solid #5a4a78;border-radius:4px;padding:10px;font-size:calc(15.5px * var(--ts));line-height:1.5;color:#e0d4f0;}
.lastlog{background:#0b090e;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:calc(14.5px * var(--ts));color:var(--dim);line-height:1.6;width:100%;text-align:left;}

/* ---------- title ---------- */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;position:relative;}
.title h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:calc(46px * var(--ts));letter-spacing:.06em;color:#eee4ef;text-shadow:0 0 18px #b3313a66,3px 3px 0 #000;}
.title .en{font:calc(13px * var(--ts)) var(--f-num);letter-spacing:.3em;color:var(--dim);}
.title .menu{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;}
.title .foot{font-size:calc(13px * var(--ts));color:var(--faint);text-align:center;}
.jobgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.job{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:14px 4px 6px;cursor:pointer;text-align:center;}
.job.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.job.locked{opacity:.5;}
.job b{font-family:var(--f-disp);font-weight:400;font-size:calc(18px * var(--ts));}
.job small{font-size:calc(13px * var(--ts));color:var(--dim);line-height:1.35;}
.jobinfo{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:10px;font-size:calc(14.5px * var(--ts));line-height:1.55;}
.jobinfo .rule{color:var(--soul);}
.bonus{display:flex;gap:8px;align-items:center;background:#16131b;border:1px dashed #5a4a78;border-radius:5px;padding:10px;}
.bonus .bd{flex:1;font-size:calc(14.5px * var(--ts));color:var(--dim);line-height:1.4;}
.bonus .bd b{color:var(--text);font-size:calc(15.5px * var(--ts));}
.progress{height:6px;background:#1a1720;border-radius:3px;overflow:hidden;}
.progress i{display:block;height:100%;background:var(--soul);}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;}

/* ===== 가독성 패스 (모바일 기준): 예고 카드 좌우 분리 + 숫자 크게
   큰 숫자(예고·체력·피해·쿨타임)는 도트 글꼴, 작은 숫자는 굵은 일반 글꼴 ===== */
.intents{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;padding:0 12px;align-items:start;}
.intents.one{display:flex;justify-content:center;}

.intents.one .intent{width:auto;max-width:86%;align-items:center;}
.intents .intent:after{display:none;}
.intents .intent .ih{font-size:calc(15.5px * var(--ts));}
.intents .intent .ik{font-size:calc(15.5px * var(--ts));}
.intents .intent .iv{font:calc(32px * var(--ts)) var(--f-num);line-height:1.05;}
.intents .intent .isub{text-align:left;font-size:calc(15px * var(--ts));line-height:1.45;}

.intents .intent.deb .irow b{color:var(--curse);} .intents .intent.buf .irow b{color:#f0a060;}
/* big numbers: pixel font, larger */
.bar{height:22px;} .bar b{font:calc(16px * var(--ts)) var(--f-num);}
.slot .cdn{font:calc(26px * var(--ts)) var(--f-num);}
.fnum{font-size:calc(28px * var(--ts));} .fnum.big{font-size:calc(36px * var(--ts));} .fnum.b{font-size:calc(18px * var(--ts));} .fnum.s{font:700 calc(17px * var(--ts)) var(--f-ui);}
.preview .h .num{font-size:calc(20px * var(--ts));}
/* small numbers: bold UI font */
.chip,.chip .num{font:700 calc(16px * var(--ts)) var(--f-ui);}
.bar .shield{font:700 calc(14.5px * var(--ts)) var(--f-ui);}
.st{font:700 calc(17px * var(--ts)) var(--f-ui);padding:2px 8px 2px 4px;} .st b{font-size:calc(15px * var(--ts));}
.slot .up,.slot .uses{font:700 calc(14.5px * var(--ts)) var(--f-ui);padding:0 3px;}
.relics .ri i{font:700 calc(13px * var(--ts)) var(--f-ui);}
.card .price{font:700 calc(17px * var(--ts)) var(--f-ui);}
.stats b{font:700 calc(15.5px * var(--ts)) var(--f-ui);}
.lastlog .num,.ascrow .num{font-family:var(--f-ui);font-weight:700;}
/* tiny labels up a notch */
.sub{font-size:calc(14.5px * var(--ts));}
.bline{font-size:calc(15.5px * var(--ts));}

G.slot = function (run, k) {
  if (k === 'w' || k === 'a' || k === 't') return run.eq[k] || null;
  var c = k[0], i = +k.slice(1);
  if (c === 's') return run.sk[i] || null;

  if (c === 'r') return run.relics[i] || null;

  if (c === 's') run.sk[i] = v;
  else if (c === 'c') { if (i < run.cons.length) run.cons[i] = v; }
  else if (c === 'r') { if (v) run.relics[i] = v; else run.relics.splice(i, 1); }

  'counter', 'lastStand', 'execBonus', 'bigPct', 'offerPlus', 'lsAll', 'curseHalf', 'curseAtk', 'graveBless',
  'xpPct', 'blkPlus', 'firstHit', 'healPct', 'thornPoison', 'extraHit', 'magicCdr', 'deathwish', 'blkDmg', 'undying', 'brew', 'campTwice', 'tombPlus'];
G.pas = function (run) {
  var key = run.job + '|' + G.itemKeys(run).map(function (k) { var i = G.slot(run, k); return k + i.id + i.up + (i.cursed ? 'x' : ''); }).join(',') + '|' + run.perks.join(',');
  if (run._pk === key && run._pc) return run._pc;
  var P = G.pasCalc(run);
  Object.defineProperty(run, '_pc', { value: P, writable: true, configurable: true, enumerable: false });
  Object.defineProperty(run, '_pk', { value: key, writable: true, configurable: true, enumerable: false });
  return P;
};
G.pasCalc = function (run) {
  var P = { start: [], turn: [], kill: [] };
  NUMKEYS.forEach(function (k) { P[k] = 0; });
  function addPas(pas, pu, up) {
    if (!pas) return;
    NUMKEYS.forEach(function (k) {
      if (pas[k]) {
        if (k === 'cdrEvery') { P[k] = P[k] ? Math.min(P[k], pas[k]) : pas[k]; }
        else P[k] += pas[k];
      }
      if (pu && pu[k] && up && k !== 'cdrEvery') P[k] += pu[k] * up;
    });
    ['start', 'turn', 'kill'].forEach(function (k) {
      if (pas[k]) pas[k].forEach(function (e) {
        var c = G.clone(e);
        if (pu && pu[k] && up) c.v = (c.v || 0) + pu[k] * up;
        P[k].push(c);
      });
    });
  }
  var nCursed = 0;
  G.allItems(run).forEach(function (inst) {
    var d = G.idef(inst);
    addPas(d.pas, d.pu, inst.up);
    if (inst.cursed) nCursed++;
  });
  run.perks.forEach(function (pid) { addPas(G.PERK[pid].pas); });
  P.nCursed = nCursed;
  if (P.curseAtk) P.atk += P.curseAtk * nCursed;
  if (run.job === 'hexer') P.atk += G.JOBK.hexAtk * nCursed;
  return P;
};
// active curse list on the run [{id, v}]
G.curses = function (run) {
  var out = [];
  if (run.job === 'hexer') return out;
  var half = run.perks.indexOf('hexlove') >= 0;
  G.allItems(run).forEach(function (inst) {
    if (inst && inst.cursed && inst.curse) {
      var c = G.CURSES[inst.curse];
      out.push({ id: inst.curse, v: c.v ? (half ? Math.ceil(c.v / 2) : c.v) : 0, half: half });
    }
  });
  return out;
};
G.hasCurse = function (run, id) { return G.curses(run).filter(function (c) { return c.id === id; }); };

G.maxHp = function (run) {
  var P = G.pas(run);
  var v = run.baseHp + run.bonusHp + P.hp;
  G.hasCurse(run, 'hpdown').forEach(function (c) { v -= c.v; });
  return Math.max(10, v);
};
G.lvAtk = function (run) { return Math.floor((run.lv - 1) / 2); };
// 피해 보너스 내역 (설명·길게 누르기 팝업용): 무기·도구 기본 피해에 더해지는 고정 보너스를 출처별로
// magic: 마법 피해면 true. 전투 중이면 지금 상황(힘, 체력 50% 이하, 정예·보스 상대)도 반영
G.dmgParts = function (run, magic) {
  var parts = [], add = function (n, v) { if (v) parts.push({ n: n, v: v }); };
  var P = G.pas(run), b = run.b;
  add('직업 기본 공격', G.JOB[run.job].atk);
  add('레벨 보너스 (Lv.' + run.lv + ')', G.lvAtk(run));
  var key = magic ? 'mdmg' : 'pdmg', perkN = {};
  G.allItems(run).forEach(function (inst) {
    var d = G.idef(inst), pas = d.pas || {}, pu = d.pu || {}, up = inst.up || 0;
    add(G.itemName(inst), (pas.atk || 0) + (pu.atk || 0) * up + (pas[key] || 0) + (pu[key] || 0) * up);
  });
  run.perks.forEach(function (pid) { var pp = G.PERK[pid].pas || {}, v = (pp.atk || 0) + (pp[key] || 0); if (v) perkN[pid] = (perkN[pid] || 0) + v; });
  Object.keys(perkN).forEach(function (pid) { add(G.tx('특성 {0}', G.PERK[pid].n), perkN[pid]); });
  if (P.curseAtk && P.nCursed) add('저주 아이템 ' + P.nCursed + '개', P.curseAtk * P.nCursed);
  if (run.job === 'hexer' && P.nCursed) add('주술사: 저주 아이템 ' + P.nCursed + '개', G.JOBK.hexAtk * P.nCursed);
  if (b && b.ps && run.phase === 'battle') {
    add('힘', b.ps.str || 0);
    if (P.lowStr && run.hp <= G.maxHp(run) / 2) add('체력 50% 이하', P.lowStr);
    if (b.e && b.e.k !== 'n') add('정예·보스·망자 상대', P.bigDmg);
  }
  return { parts: parts, flat: parts.reduce(function (a, x) { return a + x.v; }, 0) };
};
G.atk = function (run) { return G.JOB[run.job].atk + G.pas(run).atk + G.lvAtk(run); };
G.def = function (run) { return G.JOB[run.job].def + G.pas(run).def; };

// ---------- item instances ----------
G.mkItem = function (run, id, up, opts) {
  var d = G.ITEM[id];
  var inst = { id: id, up: up || 0, cd: 0 };
  if (d.sk && d.sk.uses) inst.uses = d.sk.uses + (run ? G.pas(run).extraUses + (run.job === 'alchemist' ? 1 : 0) : 0);
  if (d.r === 'x' && d.curse) { inst.cursed = true; inst.curse = d.curse; }
  if (opts && opts.curse && G.cursable(d)) { inst.cursed = true; inst.curse = opts.curse; }
  return inst;
};
G.itemName = function (inst) {
  var d = G.idef(inst);
  return d.n + (inst.up ? ' +' + inst.up : '');
};
// only equipment and relics can carry curses
G.cursable = function (d) { var c = G.catOf(d); return c === 'w' || c === 'a' || c === 't' || c === 'r'; };
G.canUpgrade = function (inst) {
  if (!inst) return false;
  var d = G.idef(inst);
  if (G.catOf(d) === 'c') return false;
  if (inst.up >= 3) return false;
  if (d.sk && d.sk.fx.some(function (e) { return e.uv; })) return true;
  if (d.pu) return true;
  return false;
};

// ---------- statuses ----------
G.S = function (run, who) { return who === 'p' ? run.b.ps : run.b.e.st; };
G.addSt = function (run, who, s, v) {
  if (!v) return;
  var st = G.S(run, who);
  if (who === 'e' && run.b.e.boss && s === 'stun') {
    // bosses resist repeated stuns
    if (run.b.e.stunRes > 0) { G.ev(run, { k: 'resist', who: who, s: s }); return; }
    run.b.e.stunRes = 3;
  }
  st[s] = (st[s] || 0) + v;
  G.ev(run, { k: 'st', who: who, s: s, v: v });
};
G.hpOf = function (run, who) { return who === 'p' ? run.hp : run.b.e.hp; };
G.maxOf = function (run, who) { return who === 'p' ? G.maxHp(run) : run.b.e.maxHp; };

// events collected during an action (for UI animation)
G.ev = function (run, e) { if (run._ev) run._ev.push(e); };
G.blog = function (run, txt) {
  if (!run.b) return;
  run.b.log.push({ t: run.b.turn, x: txt });
  if (run.b.log.length > 30) run.b.log.shift();
};

// ---------- damage ----------
// opts: dt 'm'|'p', pierce, exec, isFx(true dmg), name
G.calcHit = function (run, src, tgt, base, opts) {
  opts = opts || {};
  var b = run.b, P = run._pas || G.pas(run);
  var dmg = base;
  var sst = G.S(run, src), tst = G.S(run, tgt);
  var magic = opts.dt === 'm';
  if (!opts.isFx) {
    if (src === 'p') {
      dmg += G.JOB[run.job].atk + P.atk + G.lvAtk(run) + (magic ? P.mdmg : P.pdmg);
      dmg += (sst.str || 0);
      if (P.lowStr && run.hp <= G.maxHp(run) / 2) dmg += P.lowStr;
      var e = b.e;
      if (e.k !== 'n') dmg += P.bigDmg;
    } else {
      dmg += (sst.str || 0);
    }
    if (sst.weak) dmg *= 0.75;
  }
  if (tst.vuln) dmg *= 1.5;
  if (src === 'p' && !opts.isFx) {
    var eh = b.e.hp / b.e.maxHp;
    if (opts.exec && eh <= 0.3) dmg *= opts.exec;
    if (P.execBonus && eh <= 0.3) dmg *= 1 + P.execBonus;
    if (P.bigPct && b.e.k !== 'n') dmg *= 1 + P.bigPct;
    if (run.job === 'berserker' && run.hp <= G.maxHp(run) / 2) dmg *= G.JOBK.berserk;
    if (P.deathwish && run.hp <= G.maxHp(run) * 0.3) dmg *= 1 + P.deathwish;
    if (b.dbl) dmg *= 2;
  }
  // defense
  if (!magic && !opts.pierce && !opts.isFx) {
    var dv = tgt === 'p' ? G.def(run) : (b.e.def || 0);
    dmg -= dv;
  }
  if (tgt === 'e' && b.e.trait && b.e.trait.ghost && !magic && !opts.isFx) dmg *= 0.5;
  if (tgt === 'p' && P.lastStand && run.hp <= G.maxHp(run) * 0.3) dmg *= 0.65;
  dmg = Math.round(dmg);
  if (!opts.isFx) dmg = Math.max(1, dmg);
  if (tst.bleed && !opts.isFx) dmg += tst.bleed;
  return Math.max(0, dmg);
};

G.applyHit = function (run, src, tgt, base, opts) {
  opts = opts || {};
  var b = run.b;
  var tst = G.S(run, tgt);
  b.lastMiss = false;
  if (src === 'p') b.pHit = true; // 반사·가시 같은 간접 피해 포함
  if (!opts.isFx) { if (src === 'p') b.pAtk = true; else { b.eAtk = true; b.eAtkEver = true; } } // 이번 차례에 실제로 공격했는지 (상태이상 감소 기준)
  if (tst.dodge && !opts.isFx) {
    tst.dodge--; if (!tst.dodge) delete tst.dodge;
    b.lastMiss = true;
    G.ev(run, { k: 'miss', who: tgt });
    G.blog(run, (tgt === 'p' ? G.tx('회피!') : G.tx('{0} 회피!', b.e.n)));
    if (tgt === 'p' && src === 'e' && run.job === 'ninja' && b.e.hp > 0) {
      var cv = G.applyHit(run, 'p', 'e', G.ninjaCounter(run), { isFx: 1 });
      G.ev(run, { k: 'counter', v: cv });
      G.blog(run, G.tx('표창 반격 → {0} 피해', cv));
      b.lastMiss = true; // 반격 공격이 lastMiss 를 지워서, 피한 공격의 부가 효과(출혈 등)가 들어가던 문제
    }
    return 0;
  }
  var dmg = G.calcHit(run, src, tgt, base, opts);
  var absorbed = 0;
  if (tst.block && !opts.noBlock) {
    absorbed = Math.min(tst.block, dmg);
    tst.block -= absorbed; if (!tst.block) delete tst.block;
    dmg -= absorbed;
  }
  if (tgt === 'p') { run.hp -= dmg; run.stats.dmgTaken += dmg; b.lastHitBy = opts.name || b.e.n; if (dmg > 0) b.hurt = true; }
  else { b.e.hp -= dmg; run.stats.dmgDealt += dmg; }
  G.ev(run, { k: 'dmg', who: tgt, v: dmg, blk: absorbed, dt: opts.dt, fx: !!opts.isFx });
  var P = run._pas || G.pas(run);
  if (tgt === 'p' && src === 'e' && !opts.isFx) {
    if (absorbed > 0 && P.counter && b.e.hp > 0) {
      G.applyHit(run, 'p', 'e', P.counter, { isFx: 1 });
      G.blog(run, G.tx('역습 → {0} 피해', P.counter));
    }
    if (b.riposte) b.ripAbs = (b.ripAbs || 0) + absorbed;
    if (run.job === 'lancer' && absorbed > 1 && b.e.hp > 0) { var rf = Math.floor(absorbed * G.JOBK.reflect); G.applyHit(run, 'p', 'e', rf, { isFx: 1 }); G.ev(run, { k: 'reflect', v: rf }); }
    if (P.thornPoison && b.e.hp > 0) G.addSt(run, 'e', 'poison', G.statusAmt(run, 'poison', P.thornPoison));
    if (P.thorns && b.e.hp > 0) G.applyHit(run, 'p', 'e', P.thorns, { isFx: 1 });
  }
  if (src === 'p' && tgt === 'e' && dmg > 0 && !opts.isFx && run.hp > 0) { // 흡혈 먼저, 가시 반사는 그 뒤 (죽은 뒤 흡혈로 살아나지 않게)
    var ls = (opts.ls || 0) + (opts.dt === 'm' ? 0 : P.ls) + P.lsAll;
    if (ls > 0) { // 소수점은 모아뒀다가 다음 타격에 (작은 타격에서도 흡혈이 사라지지 않게)
      b.lsCarry = (b.lsCarry || 0) + dmg * ls;
      var lh = Math.floor(b.lsCarry + 1e-9); b.lsCarry -= lh;
      if (lh > 0) G.healP(run, lh, true);
    }
  }
  if (src === 'p' && tgt === 'e' && !opts.isFx && b.e.thornsV && b.e.hp > 0 && run.hp > 0) { // 가시 돋친 적: 직접 때릴 때마다 반사 (보호막으로 막을 수 있음)
    G.applyHit(run, 'e', 'p', b.e.thornsV, { isFx: 1, name: '가시' }); G.blog(run, G.tx('가시 → {0} 피해', b.e.thornsV));
  }
  G.checkRevive(run);
  return dmg;
};

// healing after all modifiers (job, perks, zone, curses) — also used for UI previews
G.healMod = function (run, v) {
  if (run.job === 'cleric') v = Math.round(v * G.JOBK.clericHeal);
  var P0 = run._pas || G.pas(run);
  if (P0.healPct) v = Math.round(v * (1 + P0.healPct));
  if (G.ZONES[G.zoneOf(run.floor)].mod === 'ash') v = Math.round(v * 0.7);
  var nh = G.hasCurse(run, 'noheal');
  if (nh.length) v = Math.floor(v * (nh[0].half ? 0.75 : 0.5));
  return v;
};
G.healP = function (run, v, quiet) {
  if (v <= 0) return 0;
  v = G.healMod(run, v);
  var mx = G.maxHp(run);
  var room = mx - run.hp;
  var got = Math.min(room, v);
  run.hp += got;
  if (got > 0) G.ev(run, { k: 'heal', who: 'p', v: got });
  if (run.job === 'cleric' && v > got && run.b && run.phase === 'battle') {
    var over = v - got;
    run.b.ps.block = (run.b.ps.block || 0) + over;
    G.ev(run, { k: 'st', who: 'p', s: 'block', v: over });
  }
  return got;
};
G.healE = function (run, v) {
  var e = run.b.e; var got = Math.min(e.maxHp - e.hp, v);
  e.hp += got; if (got > 0) G.ev(run, { k: 'heal', who: 'e', v: got });
};

G.checkRevive = function (run) {
  if (run.hp > 0) return;
  var PU = run._pas || G.pas(run);
  if (PU.undying && run.b && !run.b.undyingUsed) {
    run.b.undyingUsed = true; run.hp = 1;
    G.ev(run, { k: 'revive', src: G.PERK.undying ? G.PERK.undying.n : G.tx('불멸') }); G.blog(run, G.tx('불멸! 체력 1로 버텨냈다.'));
    return;
  }
  // phoenix feather (relic, consumed) then second chance perk
  var keys = G.itemKeys(run);
  for (var i = 0; i < keys.length; i++) {
    var inst = G.slot(run, keys[i]);
    if (inst && G.idef(inst).pas && G.idef(inst).pas.revive) {
      G.setSlot(run, keys[i], null);
      run.hp = Math.max(1, Math.round(G.maxHp(run) * G.idef(inst).pas.revive));
      G.ev(run, { k: 'revive', src: G.idef(inst).n });
      G.blog(run, G.tx('{0}#이/가 타오르며 되살아났다!', G.idef(inst).n));
      return;
    }
  }
  var k = run.perks.indexOf('second_chance');
  if (k >= 0 && !run.usedSecond) {
    run.usedSecond = true;
    run.hp = Math.max(1, Math.round(G.maxHp(run) * 0.35));
    G.ev(run, { k: 'revive', src: G.PERK.second_chance ? G.PERK.second_chance.n : G.tx('두 번째 기회') });
    G.blog(run, G.tx('두 번째 기회! 되살아났다.'));
  }
};

// ---------- effects (player skill / passive) ----------
G.statusAmt = function (run, s, v) {
  var P = run._pas || G.pas(run);
  if (s === 'bleed') v += P.bleedPlus;
  if (s === 'poison') v += P.poisonPlus;
  if (run.job === 'mudang' && (s === 'weak' || s === 'vuln' || s === 'poison' || s === 'bleed')) v += G.JOBK.mudang;
  return v;
};
G.doFx = function (run, list, up, ctx) {
  ctx = ctx || {};
  var PX = run._pas || G.pas(run);
  for (var i = 0; i < list.length; i++) {
    var e = list[i], v = (e.v || 0) + (e.uv || 0) * (up || 0);
    if (ctx.mul && (e.t === 'dmg' || e.t === 'heal' || e.t === 'blk' || e.t === 'st')) v = Math.round(v * ctx.mul);
    if (run.hp <= 0 || (run.b && run.b.e && run.b.e.hp <= 0 && e.t === 'dmg')) break;
    switch (e.t) {
      case 'dmg':
        if (e.strip && run.b.e.st.block) { delete run.b.e.st.block; G.ev(run, { k: 'strip' }); }
        var n = (e.n || 1) + (e.n > 1 ? PX.extraHit : 0), tot = 0;
        var fh = PX.firstHit && !run.b.firstHitDone ? PX.firstHit : 0;
        run.b.firstHitDone = true;
        for (var h = 0; h < n && run.b.e.hp > 0 && run.hp > 0; h++) tot += G.applyHit(run, 'p', 'e', v + (h === 0 ? fh : 0), { dt: e.dt, pierce: e.pierce, exec: e.exec, ls: e.ls });
        ctx.dealt = (ctx.dealt || 0) + tot;
        if (e.reset && run.b.e.hp > 0 && run.b.e.hp <= run.b.e.maxHp * 0.3) ctx.reset = true; // 1대1이라 '처치 시'는 의미가 없어 '빈사 상태로 만들면'으로 변경
        break;
      case 'blk': G.addSt(run, 'p', 'block', v + (ctx.skill ? PX.blkPlus : 0)); break; // 철벽은 스킬로 얻는 보호막에만
      case 'heal': G.healP(run, v); break;
      case 'st':
        var to = e.to || (G.STATUS[e.s].neg ? 'e' : 's');
        G.addSt(run, to === 's' ? 'p' : 'e', e.s, to === 'e' ? G.statusAmt(run, e.s, v) : v);
        break;
      case 'cleanse':
        var ps = run.b ? run.b.ps : {};
        Object.keys(ps).forEach(function (s) {
          if (G.STATUS[s].neg && (!e.only || e.only === s)) delete ps[s];
        });
        G.ev(run, { k: 'cleanse' });
        break;
      case 'self':
        run.hp -= v; run.b.lastHitBy = '자해';
        G.ev(run, { k: 'dmg', who: 'p', v: v, blk: 0, fx: true });
        G.checkRevive(run);
        break;
      case 'maxhp': run.bonusHp += v; run.hp += v; G.ev(run, { k: 'maxhp', v: v }); break;
      case 'riposte': run.b.riposte = true; run.b.ripAbs = 0; break;
      case 'dbl': run.b.dblNext = true; break;
      case 'cdall': G.actives(run).forEach(function (x) { if (x.cd > 0) x.cd = 0; }); G.ev(run, { k: 'cdall' }); ctx.cdall = true; break;
    }
  }
  return ctx;
};

// ---------- enemy creation & scaling ----------
G.zoneOf = function (floor) { return ((Math.floor((floor - 1) / 10)) % G.NZ) + 1; };
G.loopOf = function (floor) { return Math.floor((floor - 1) / G.FINAL); };
G.scale = function (floor) {
  var f = (floor - 1) % 10, loop = G.loopOf(floor);
  // 구역 안에서 층이 오를수록 강해짐 (2026-09-25: 초반이 너무 쉬워 4.5%/3.5% → 7%/5.5%)
  return { hp: (1 + 0.07 * f) * (1 + 0.6 * loop), atk: (1 + 0.055 * f) * (1 + 0.35 * loop), loop: loop };
};
G.MUTATORS = [
  { id: 'rage', n: '광포', d: '적이 힘 2를 가진 채 시작' },

  if (!cons) inst.cdTurn = free ? b.turn : null; // 표시용: 턴을 안 쓰고 쓴 턴 (UI 쿨타임 숫자 보정)
  if (!free) G.endPlayerTurn(run);
};

G.restAction = function (run) { // "숨 고르기": always available
  var b = run.b;
  G.addSt(run, 'p', 'block', 3 + Math.floor(G.maxHp(run) / 20));
  G.actives(run).forEach(function (inst) { if (inst.cd > 1) inst.cd--; });
  G.ev(run, { k: 'use', slot: -1, name: '숨 고르기' });
  G.blog(run, G.tx('숨을 골랐다.'));
  if (run.job === 'monk' && (b.monkStr || 0) < G.JOBK.monkMax) { b.monkStr = (b.monkStr || 0) + 1; G.addSt(run, 'p', 'str', 1); G.blog(run, G.tx('기를 모았다. 힘 +1')); }

G.endPlayerTurn = function (run) {
  var P = run._pas = G.pas(run);

    if (c.id === 'drain') { run.hp -= c.v; run.b.lastHitBy = '갈증의 저주'; G.ev(run, { k: 'dmg', who: 'p', v: c.v, blk: 0, fx: true }); G.checkRevive(run); }
  });

  G.tickSide(run, 'p');
  if (G.checkEnd(run)) return;
  G.enemyTurn(run);
};

G.enemyTurn = function (run) {
  var b = run.b, e = b.e;
  b.pSnap = { bleed: !!b.ps.bleed, vuln: !!b.ps.vuln }; // 이번 적 턴 전에 이미 있던 것만 이번 라운드 끝에 줄어듦
  b.eAtk = false;
  delete e.st.block;
  if (e.st.stun) {
    e.st.stun--; if (!e.st.stun) delete e.st.stun;
    G.ev(run, { k: 'stunned', who: 'e' });
    G.blog(run, G.tx('{0}#은/는 기절해 움직이지 못했다.', e.n));
  } else {
    var parts = [e.intent].concat(e.intent.and || []);
    var hunger = G.activeMutators(run).some(function (m) { return m.id === 'hunger'; });
    var plague = G.activeMutators(run).some(function (m) { return m.id === 'plague'; });
    G.ev(run, { k: 'eact', t: e.intent.t, nm: e.intent.nm });
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], v = G.ival(run, p);
      if (p.t === 'atk') {
        var n = p.n || 1, tot = 0, landed = 0;
        for (var h = 0; h < n && run.hp > 0 && e.hp > 0; h++) { tot += G.applyHit(run, 'e', 'p', v, { dt: p.dt, name: e.n }); if (!b.lastMiss) landed++; }
        if (p.s && landed && run.hp > 0 && e.hp > 0) G.addSt(run, 'p', p.s, p.sv); // 전부 회피하면 부가 효과도 없음
        if (plague && run.hp > 0 && e.hp > 0) G.addSt(run, 'p', 'poison', 1);
        if (hunger && tot > 0 && e.hp > 0) G.healE(run, Math.floor(tot / 2));
        if (e.mod === 'vamp' && tot > 0 && e.hp > 0) G.healE(run, Math.floor(tot * 0.3));
        G.blog(run, (p.nm || e.intent.nm) ? G.tx('{0}의 {1} → {2} 피해', e.n, p.nm || e.intent.nm, tot) : G.tx('{0}의 공격 → {1} 피해', e.n, tot));
      } else if (p.t === 'blk') { G.addSt(run, 'e', 'block', v); G.blog(run, G.tx('{0} 보호막 +{1}', e.n, v)); }
      else if (p.t === 'buf') { G.addSt(run, 'e', p.s, v); G.blog(run, G.tx('{0} {1} +{2}', e.n, G.STATUS[p.s].name, v)); }
      else if (p.t === 'deb') { G.addSt(run, 'p', p.s, v); G.blog(run, G.tx('{0}: 나에게 {1} {2}', e.n, G.STATUS[p.s].name, v)); }
      else if (p.t === 'heal') { G.healE(run, v); G.blog(run, G.tx('{0} 회복 {1}', e.n, v)); }
      if (G.checkEnd(run)) return;
    }
    if (b.riposte && b.ripAbs > 0) { G.applyHit(run, 'p', 'e', b.ripAbs, { isFx: 1 }); G.blog(run, G.tx('반사 → {0} 피해', b.ripAbs)); }
  }
  b.riposte = false; b.ripAbs = 0; // 적이 기절해도 이번 턴 반사는 여기서 끝
  if (G.checkEnd(run)) return;
  G.endRound(run);
};

G.tickSide = function (run, who) {
  var st = G.S(run, who);
  if (st.poison) {
    if (who === 'p') { run.hp -= st.poison; run.b.lastHitBy = '독'; if (st.poison > 0) run.b.hurt = true; }
    else run.b.e.hp -= st.poison;
    G.ev(run, { k: 'dmg', who: who, v: st.poison, blk: 0, fx: true, dt: 'poison' });
    if (who === 'e') run.stats.dmgDealt += st.poison;
    st.poison--; if (!st.poison) delete st.poison;
    if (who === 'p') G.checkRevive(run);
  }
  if (st.regen) {
    if (who === 'p') G.healP(run, st.regen); else G.healE(run, st.regen);
    st.regen--; if (!st.regen) delete st.regen;
  }
  // 나에게 걸린 출혈·취약은 적이 실제로 때린 뒤에 줄어듦 (endRound) — 내 턴 끝에 줄면 1짜리는 효과가 없었음
  // 적에게 건 출혈·취약은 내 다음 턴까지 남게: 이번 내 턴이 시작될 때 이미 있던 것만 줄어듦 (1짜리가 효과 없이 사라지던 문제)
  // 약화는 그 편이 실제로 공격한 차례에만, 출혈·취약은 공격을 받은 차례에만 줄어듦 (공격 없는 턴에 효과 없이 사라지던 문제)
  var b = run.b, es = b.eSnap || {}, L = [];
  if (who === 'p') { if (b.pAtk) L.push('weak'); }
  else { if (b.eAtk) L.push('weak'); if (b.pAtk && es.bleed) L.push('bleed'); if (b.pHit && es.vuln) L.push('vuln'); } // 취약은 반사·가시 피해에도 적용되므로 그때도 줄어듦
  L.forEach(function (s) { if (st[s]) { st[s]--; if (!st[s]) delete st[s]; } });
};

G.RAGE_T = 12; G.RAGE_T2 = 20; // 분노 시작 턴 · 분노 강화(+3) 턴 — 화면 표시도 이 값을 씀
G.endRound = function (run) {
  var b = run.b, e = b.e;
  G.tickSide(run, 'e');
  if (b.eAtk) ['bleed', 'vuln'].forEach(function (s) { if (b.pSnap && b.pSnap[s] && b.ps[s]) { b.ps[s]--; if (!b.ps[s]) delete b.ps[s]; } });
  b.pSnap = null;
  if (e.trait && e.trait.regen && e.hp > 0) G.healE(run, Math.round(e.trait.regen * e.hpMul));
  if (e.mod === 'regen' && e.hp > 0) G.healE(run, Math.round(e.maxHp * 0.05));
  if (e.stunRes) e.stunRes--;
  // anti-stall: enemies enrage after a long fight
  if (b.turn >= G.RAGE_T && e.hp > 0) { G.addSt(run, 'e', 'str', b.turn >= G.RAGE_T2 ? 3 : 1); if (b.turn === G.RAGE_T) { G.blog(run, G.tx('{0}#이/가 분노하기 시작했다!', e.n)); G.ev(run, { k: 'enrage' }); } }
  if (G.checkEnd(run)) return;
  // new player turn
  b.turn++;
  run.stats.turns++;
  b.eSnap = { bleed: !!e.st.bleed, vuln: !!e.st.vuln }; b.pAtk = false; b.pHit = false;
  var P = run._pas = G.pas(run);
  if (P.blkDmg && b.ps.block && e.hp > 0) { var bd = Math.floor(b.ps.block * P.blkDmg); if (bd > 0) { G.applyHit(run, 'p', 'e', bd, { isFx: 1 }); G.blog(run, G.tx('방패 강타 → {0} 피해', bd)); if (G.checkEnd(run)) return; } }
  var keep = run.job === 'wanderer' ? Math.floor((b.ps.block || 0) * G.JOBK.keep) : 0;
  if (!b.eAtkEver && b.startBlk) keep = Math.max(keep, Math.min(b.ps.block || 0, b.startBlk)); // 전투 시작 보호막은 적의 첫 공격까지 남음
  delete b.ps.block;
  if (keep) b.ps.block = keep;
  G.actives(run).forEach(function (inst) { if (inst.cd > 0) inst.cd--; });
  if (P.cdrEvery && b.turn % P.cdrEvery === 0) G.actives(run).forEach(function (inst) { if (inst.cd > 0) inst.cd--; });
  G.nextIntent(run);
  if (b.ps.stun) {
    b.ps.stun--; if (!b.ps.stun) delete b.ps.stun;
    G.ev(run, { k: 'stunned', who: 'p' });
    G.blog(run, G.tx('기절해 움직이지 못했다.'));
    G.endPlayerTurn(run);
  }
};

// returns true if battle ended (win or death)
G.checkEnd = function (run) {
  if (run.phase !== 'battle') return true;
  if (run.hp <= 0) { G.die(run, run.b.lastHitBy || run.b.e.n); return true; }
  if (run.b.e.hp <= 0) { G.winBattle(run); return true; }
  G.checkPhase(run);
  return false;
};
// boss phase 2 at half HP
G.checkPhase = function (run) {
  var e = run.b.e;
  if (!e.p2 || e.p2on || e.hp > e.maxHp / 2) return;
  G.enterPhase2(run);
};
G.enterPhase2 = function (run) {
  var e = run.b.e, p = e.p2;
  e.p2on = 1;
  e.ai = G.clone(p.ai); e.aiIdx = 0; e.lastIntent = null;
  if (p.cleanse) Object.keys(e.st).forEach(function (s) { if (G.STATUS[s].neg) delete e.st[s]; });
  if (p.heal) G.healE(run, Math.round(e.maxHp * p.heal));
  (p.buf || []).forEach(function (x) { G.addSt(run, 'e', x.s, x.v); });
  (p.deb || []).forEach(function (x) { G.addSt(run, 'p', x.s, x.v); });
  G.ev(run, { k: 'phase', msg: p.msg });
  G.blog(run, G.tx('{0}: {1}', e.n, p.msg));
  // keep the telegraphed move; the next intent roll starts the phase-2 pattern from move #1
};

// ---- 31_run.js
// ===== 31_run: run lifecycle, rooms, rewards, meta, action API =====
G.XP_NEED = function (lv) { return 12 + lv * 4; };
// 유산(영구 강화)은 삭제 (사용자 확정 2026-09-25). 정찰병은 공물 '운명의 실'로 옮김 (run.scout)

G.newMeta = function () {
  return { v: 1, soul: 0, jobs: { wanderer: 1, rogue: 1, hexer: 1 }, graves: [], best: 0, runs: 0, clears: 0,
    seenM: {}, seenI: {}, seenE: {}, ach: {}, adsRemoved: false, bonusReady: true, tut: {},
    settings: { sound: 1, music: 1, textSize: 1, oneTap: 0 }, totalSoul: 0 };
};

G.newRun = function (meta, jobId, seed, opts) {
  opts = opts || {};
  var job = G.JOB[jobId];
  var run = { v: 2, seed: seed >>> 0, rs: seed >>> 0, job: jobId, name: '', baseHp: job.hp, bonusHp: 0, hp: 0,
    lv: 1, xp: 0, gold: 20, eq: { w: null, a: null, t: null }, sk: [null, null, null], cons: [null, null, null], relics: [],
    perks: [], floor: 1, phase: 'map', doors: [],
    q: [], b: null, seenEv: [], nextB: [], zoneBoss: {}, graveFloor: {}, graveUsed: {}, pity: 0, sinceCamp: 0,
    usedSecond: false, rerolls: 0, endless: false, cleared: false, meta: meta,
    stats: { kills: 0, elites: 0, bosses: 0, battles: 0, turns: 0, dmgDealt: 0, dmgTaken: 0, rooms: 0, goldGot: 0, graves: 0, bestHit: 0 },
    room: null, tip: null, deathBy: null };
  run.name = G.pick(run, G.NAMES);
  // 망자의 기운 (ascension)
  run.asc = opts.daily ? 0 : Math.max(0, Math.min(G.ASC_MAX, opts.asc | 0));
  if (G.ascOn(run, 3)) run.gold = G.ASCV.gold;
  if (G.ascOn(run, 7)) run.cons = [null, null];
  if (G.ascOn(run, 9)) run.baseHp = Math.round(job.hp * (1 - G.ASCV.hp));
  run.kit = opts.kit === 'b' && G.KIT2 && G.KIT2[jobId] ? 'b' : 'a';
  // 기운 7(소모품 2칸)처럼 자리가 모자라면 버리지 말고 시작하자마자 교체 창으로
  run.baseGold = run.gold; // 기본 시작 골드 (공물·선물로 받은 골드와 구분 — 무거운 갑주는 이것만 잃음)
  var put = function (id) { var it = G.mkItem(run, id); it.kit = 1; if (!G.place(run, it)) run.q.push({ k: 'gain', item: it, src: 'bonus' }); }; // kit: 직업 시작 장비 표시
  (G.kitItems ? G.kitItems(jobId, run.kit) : job.start).forEach(put);
  if (opts.bonus) G.applyBonus(run, opts.bonus);
  if (opts.consBonus && G.ITEM[opts.consBonus]) { var cb = G.mkItem(run, opts.consBonus); if (!G.place(run, cb)) run.q.push({ k: 'gain', item: cb, src: 'bonus' }); }
  (opts.tribute || []).forEach(function (id) { G.applyTribute(run, id); });
  if (opts.daily) run.daily = opts.daily;
  if (meta && meta.seenI) G.allItems(run).forEach(function (it) { meta.seenI[it.id] = 1; }); // 도감: 시작 장비도 본 것으로
  run.hp = G.maxHp(run);
  G.enterZone(run);
  G.genDoors(run);
  if (opts.bless) { run.pending = { k: 'bless', offer: G.rollBless(run) }; run.phase = 'bless'; } // 문지기의 제안 (20차)
  return run;
};

// pre-run bonus chest (rewarded ad placement): side-grades, not raw power
G.BONUSES = [
  { id: 'b_gold', n: '금화 주머니', d: '골드 +50' },
  { id: 'b_item', n: '낡은 보따리', d: '희귀 아이템 1개' },
  { id: 'b_hp', n: '수호의 부적', d: '1구역에서 최대 체력 +10 (2구역부터 사라짐)' },
  { id: 'b_perk', n: '예지몽', d: '시작하자마자 특성 1개 선택' }
];
G.applyBonus = function (run, id) {
  if (id === 'b_gold') run.gold += 50;
  if (id === 'b_item') { var bi = G.mkItem(run, G.rollItems(run, 1, { minR: 'u', maxR: 'u', cw: { s: 3, a: 2, t: 2, r: 2 } })[0]); if (!G.place(run, bi)) run.q.push({ k: 'gain', item: bi, src: 'bonus' }); }
  if (id === 'b_hp') { run.bonusHp += 10; run.tempHp = 10; }
  if (id === 'b_perk') run.q.push({ k: 'levelup', free: 1 });
};

// put a new item where it belongs; false = its slots are full (player must choose)
G.place = function (run, inst) {
  var d = G.idef(inst), c = G.catOf(d), i;
  if (c === 'r') {
    run.relics.push(inst);
    if (d.pas && d.pas.extraUses) run.cons.forEach(function (x) { if (x) x.uses += d.pas.extraUses; });
    return true;
  }
  if (c === 'c') {
    for (i = 0; i < run.cons.length; i++) if (run.cons[i] && run.cons[i].id === inst.id) { if (run.cons[i].kit && !inst.kit) run.cons[i].keepUses = (run.cons[i].keepUses || 0) + (inst.uses || 1); run.cons[i].uses = (run.cons[i].uses || 0) + (inst.uses || 1); return true; }
    for (i = 0; i < run.cons.length; i++) if (!run.cons[i]) { run.cons[i] = inst; return true; }
    return false;
  }
  if (c === 's') { for (i = 0; i < 3; i++) if (!run.sk[i]) { run.sk[i] = inst; return true; } return false; }
  if (!run.eq[c]) { run.eq[c] = inst; return true; }
  return false;
};
G.addToBag = G.place;
// would this item fit without asking the player?
G.canPlace = function (run, inst) {
  var c = G.catOf(G.idef(inst));
  if (c === 'r') return true;
  if (c === 'c') return run.cons.some(function (x) { return !x || x.id === inst.id; });
  if (c === 's') return run.sk.some(function (x) { return !x; });
  return !run.eq[c];
};
// put a new item straight into a chosen slot (replacing what is there); false if that slot is not allowed
G.putInSlot = function (run, inst, key) {
  if (!key || G.swapKeys(run, inst).indexOf(key) < 0) return false;
  G.setSlot(run, key, inst);
  if (run.meta) run.meta.seenI[inst.id] = 1;
  G.ev(run, { k: 'gain', id: inst.id });
  run.hp = Math.min(run.hp, G.maxHp(run));
  return true;
};
// slots a pending item may replace (cursed ones are locked)
G.swapKeys = function (run, inst) {
  var c = G.catOf(G.idef(inst)), ks = c === 's' ? ['s0', 's1', 's2'] : c === 'c' ? ['c0', 'c1', 'c2'] : c === 'r' ? [] : [c];
  return ks.filter(function (k) { var x = G.slot(run, k); return x && !x.cursed; });
};

// ---------- zone / door generation ----------
G.zoneBossFor = function (run, z) {
  var key = run.floor > G.FINAL ? (z + '_' + G.loopOf(run.floor)) : z;
  if (!run.zoneBoss[key]) {
    var bosses = G.MONSTERS.filter(function (m) { return m.k === 'b' && m.z === z; });
    run.zoneBoss[key] = G.pick(run, bosses).id;
  }
  return run.zoneBoss[key];
};
// 아이템 풀 기준: 오늘의 도전은 서고 상태와 무관하게 모두 같은 풀(전부 열림)
G.poolMeta = function (run) { return run.daily ? null : run.meta; };
G.enterZone = function (run) {
  var z = G.zoneOf(run.floor), key = Math.floor((run.floor - 1) / 10);
  if (run.tempHp && run.floor > 10) { run.bonusHp -= run.tempHp; run.tempHp = 0; run.hp = Math.min(run.hp, G.maxHp(run)); }
  if (run.graveFloor[key] != null) return;
  run.graveFloor[key] = -1;
  var meta = run.meta; if (!meta || run.daily) return; // 오늘의 도전엔 개인 무덤이 안 나옴
  var cands = meta.graves.filter(function (g) { return g.zone === z && !run.graveUsed[g.gid]; });
  if (!cands.length) return;

};
// 몬스터 세기 = 체력 × 턴당 평균 피해 (구역 안에서 줄 세우는 용도)
G.monPower = function (m) {
  var dmg = 0, w = 0;
  m.ai.l.forEach(function (a) { var ww = a.w || 1, d = 0; [a].concat(a.and || []).forEach(function (p) { if (p.t === 'atk') d += p.v * (p.n || 1); if (p.t === 'deb' && (p.s === 'poison' || p.s === 'bleed')) d += p.v; }); if (a.s === 'poison' || a.s === 'bleed') d += a.sv || 0; dmg += d * ww; w += ww; });
  return m.hp * (1 + (m.def || 0) * 0.08) * (dmg / w);
};
G.MON_SPREAD = 0.22; // 층 위치에서 얼마나 벗어난 세기까지 섞여 나오는지
G.pickMonster = function (run, kind) {
  var z = G.zoneOf(run.floor);
  var pool = G.MONSTERS.filter(function (m) { return m.z === z && m.k === kind; });
  pool.sort(function (a, b) { return G.monPower(a) - G.monPower(b); });
  // 구역 1~3층은 약한 쪽, 4~6층 중간, 7~9층 강한 쪽이 주로 나옴 (가끔 한 단계 위·아래가 섞임)
  var f = ((run.floor - 1) % 10) + 1, t = Math.min(1, Math.max(0, (f - 1) / 8)), n = pool.length;
  var wOf = function (m) { var r = n > 1 ? pool.indexOf(m) / (n - 1) : 0.5; return Math.exp(-Math.pow(r - t, 2) / (2 * G.MON_SPREAD * G.MON_SPREAD)) + 0.01; };
  // avoid last 3 enemies

// ===== 35_score: 판 점수 (슬더스 점수 체계를 우리 게임에 맞게, 사용자 확정 2026-09-25) =====
// 기록용: 영혼석·밸런스에는 영향 없음. 전체 최고, 직업별 최고, 오늘의 도전 최고를 남긴다.
G.SCORE_ASC = 0.1; // 망자 단계당 +10%
G.calcScore = function (run) {
  var S = run.stats, L = [];
  var add = function (n, d, v) { if (v) L.push({ n: n, d: d, v: v }); };
  var won = !!(run.cleared || run.phase === 'victory' || run.ascDone);
  var items = G.allItems(run);
  // 기본
  var fl = run.endless ? run.floor : Math.min(run.floor, G.FINAL);
  add('도달 층', fl + '층 × 5', fl * 5);
  add('처치', S.kills + '마리 × 2', S.kills * 2);
  add('정예 처치', S.elites + '마리', S.eliteScore || 0);
  add('보스 처치', S.bosses + '마리', S.bossScore || 0);
  add('망자 안식', S.graves + '명 × 30', (S.graves || 0) * 30);
  if (won) add('정복', '40층 정복', 250);
  // 전투 업적
  add('무결', '피해 없이 정예 ' + (S.eliteClean || 0) + '마리 처치', (S.eliteClean || 0) * 25);
  if ((S.bossClean || 0) >= 3) add('초월', '피해 없이 보스 ' + S.bossClean + '마리 처치', 200);
  else add('완벽', '피해 없이 보스 ' + (S.bossClean || 0) + '마리 처치', (S.bossClean || 0) * 50);
  if ((S.bestHit || 0) >= 100) add('일격', '한 번에 ' + S.bestHit + ' 피해', 25);
  // 수집
  var rel = run.relics.length;
  if (rel >= 16) add('유물 수집가', '유물 ' + rel + '개', 50); else if (rel >= 12) add('유물 모음', '유물 ' + rel + '개', 25);
  var leg = items.filter(function (x) { return G.idef(x).r === 'l'; }).length;
  add('전설의 주인', '전설 아이템 ' + leg + '개 × 10', leg * 10);
  var up3 = items.filter(function (x) { return (x.up || 0) >= 3; }).length;
  add('장인', '+3 아이템 ' + up3 + '개 × 20', up3 * 20);
  if (won && !items.some(function (x) { var r = G.idef(x).r; return r === 'r' || r === 'l'; })) add('청빈', '영웅·전설 없이 정복', 100);
  // 자원
  var g = S.goldGot || 0;
  if (g >= 1500) add('큰 부자', '누적 골드 ' + g, 50); else if (g >= 1000) add('부자', '누적 골드 ' + g, 25);
  var hpUp = G.maxHp(run) - G.JOB[run.job].hp;
  if (hpUp >= 110) add('거인', '최대 체력 +' + hpUp, 50); else if (hpUp >= 80) add('거구', '최대 체력 +' + hpUp, 25);
  var cur = items.filter(function (x) { return x.cursed; }).length;
  if (cur >= 3) add('저주 수집', '저주 아이템 ' + cur + '개', 100);
  if ((S.events || 0) >= 10) add('호기심', '이벤트 ' + S.events + '번', 25);
  // 속도 (정복한 판만): 전투 턴 합계
  var turns = (S.turns || 0) + (S.battles || 0);
  if (won && turns <= 70) add('번개', '전투 ' + turns + '턴 만에 정복', 50); else if (won && turns <= 85) add('속전속결', '전투 ' + turns + '턴 만에 정복', 25);
  var base = L.reduce(function (a, x) { return a + x.v; }, 0);
  var mult = 1 + G.SCORE_ASC * (run.asc || 0);
  return { lines: L, base: base, mult: mult, total: Math.round(base * mult) };
};
// 최고 기록 남기기 (여러 번 불려도 최댓값만)
G.recordScore = function (run) {
  var m = run.meta; if (!m) return null;
  var sc = G.calcScore(run); run.score = sc.total;
  m.bestScore = m.bestScore || 0; m.jobScore = m.jobScore || {};

    return sc; // 오늘의 도전은 따로
  }
  if (sc.total > m.bestScore) { m.bestScore = sc.total; run.scoreNew = true; }
  if (sc.total > (m.jobScore[run.job] || 0)) m.jobScore[run.job] = sc.total;

G.resolveSpr = function (key) {
  var d = G.SPR[key];
  if (!d) return null;

  var rows, pal = {};
  if (d.base) {

  if (d.flip) rows = rows.map(function (r) { return r.split('').reverse().join(''); });
  var w = Math.max.apply(null, rows.map(function (r) { return r.length; }));

// ===== 50_audio: tiny WebAudio synth for SFX (no assets) =====
G.SFX = (function () {
  var ctx = null, master = null, on = true, noiseBuf = null;
  function init() {
    if (ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.32; master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }
  function env(g, t, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
  }
  function tone(type, f0, f1, dur, vol, delay) {
    var t = ctx.currentTime + (delay || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.005, vol, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, q, delay, type) {
    var t = ctx.currentTime + (delay || 0), s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = q || 1;
    env(g, t, 0.003, vol, dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  var S = {
    click: function () { tone('square', 660, 520, 0.05, 0.12); },
    hit: function () { noise(0.12, 0.5, 900, 0.8); tone('square', 180, 70, 0.1, 0.18); },
    big: function () { noise(0.25, 0.7, 500, 0.7); tone('sawtooth', 140, 40, 0.25, 0.25); },
    hurt: function () { noise(0.14, 0.45, 600, 1); tone('square', 120, 60, 0.14, 0.2); },
    block: function () { tone('triangle', 900, 700, 0.08, 0.2); noise(0.06, 0.25, 3000, 2); },
    miss: function () { noise(0.15, 0.25, 2500, 3, 0, 'highpass'); },
    heal: function () { tone('sine', 520, 780, 0.18, 0.2); tone('sine', 780, 1040, 0.16, 0.14, 0.08); },
    poison: function () { tone('sine', 300, 180, 0.2, 0.14); },
    buff: function () { tone('square', 440, 660, 0.12, 0.12); tone('square', 660, 880, 0.1, 0.1, 0.07); },
    debuff: function () { tone('square', 500, 250, 0.16, 0.12); },
    coin: function () { tone('square', 988, 0, 0.06, 0.12); tone('square', 1319, 0, 0.12, 0.12, 0.06); },
    door: function () { noise(0.3, 0.2, 300, 0.5, 0, 'lowpass'); tone('triangle', 110, 80, 0.3, 0.15); },
    level: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone('square', f, 0, 0.12, 0.12, i * 0.08); }); },
    win: function () { [392, 523, 659].forEach(function (f, i) { tone('triangle', f, 0, 0.16, 0.16, i * 0.09); }); },
    death: function () { [330, 262, 196, 131].forEach(function (f, i) { tone('sawtooth', f, f * 0.9, 0.3, 0.12, i * 0.18); }); },
    boss: function () { tone('sawtooth', 65, 55, 0.9, 0.22); noise(0.8, 0.2, 200, 0.5, 0, 'lowpass'); },
    curse: function () { tone('sawtooth', 220, 110, 0.4, 0.12); tone('sine', 233, 117, 0.4, 0.12); },
    stun: function () { [1200, 900, 1200, 900].forEach(function (f, i) { tone('square', f, 0, 0.05, 0.08, i * 0.05); }); },
    item: function () { tone('triangle', 660, 990, 0.14, 0.16); }
  };
  return {
    init: init,
    ac: function () { init(); return ctx; },
    set: function (v) { on = !!v; },
    play: function (n) { if (!on) return; init(); if (!ctx) return; if (ctx.state === 'suspended') ctx.resume(); try { S[n] && S[n](); } catch (e) { } },
    pause: function () { if (ctx && ctx.state === 'running') ctx.suspend(); },

// ===== 51_text: human-readable descriptions (Korean) =====
G.T = {};
// 무당: shown numbers include the +1 (G.T.run is set while describing for a run)
G.T.run = null;
G.T.bonus = null; // {p, m}: 물리·마법 피해 고정 보너스 (설명에 합쳐 보여줄 때만)
G.T.withBonus = function (run, fn) { G.T.bonus = run && G.dmgParts ? { p: G.dmgParts(run, false).flat, m: G.dmgParts(run, true).flat } : null; try { return fn(); } finally { G.T.bonus = null; } };
G.T.mudangPlus = function (run, s) { return !!run && run.job === 'mudang' && (s === 'weak' || s === 'vuln' || s === 'poison' || s === 'bleed'); };
G.T.alch = false; // 연금술사 소모품: 효과 ×JOBK.alch (엔진과 같은 반올림)
G.T.fx = function (e, up) {
  var v = (e.v || 0) + (e.uv || 0) * (up || 0), s;
  if (G.T.alch && (e.t === 'dmg' || e.t === 'heal' || e.t === 'blk' || e.t === 'st')) v = Math.round(v * G.JOBK.alch);
  switch (e.t) {
    case 'dmg':
      // 판 도중 가진 아이템: 레벨업·특성·유물 보너스를 더한 실제 피해 '피해 8 (6+2)' (사용자 확정 2026-09-25)
      var bn = G.T.bonus ? (e.dt === 'm' ? G.T.bonus.m : G.T.bonus.p) : 0;
      var vs = bn ? (v + bn) + ' (' + v + (bn > 0 ? '+' : '') + bn + ')' : v;
      s = G.tx(e.dt === 'm' ? '마법 피해 {0}' : '피해 {0}', vs) + (e.n > 1 ? G.tx(' × {0}회', e.n + (G.T.run && G.pas ? G.pas(G.T.run).extraHit || 0 : 0)) : '');
      if (e.pierce) s += G.tx(' · 방어 무시');
      if (e.exec) s += G.tx(', 적 체력 30% 이하면 {0}배', e.exec);
      if (e.ls) s += G.tx(', 준 피해의 {0}% 회복', Math.round(e.ls * 100));
      if (e.strip) s = G.tx('적 보호막 제거 후 {0}', s);
      if (e.reset) s += G.tx(', 적 체력을 30% 이하로 만들면 쿨타임 초기화');
      return s;
    case 'blk': return G.tx('보호막 {0}', v);
    case 'heal': return G.tx('체력 {0} 회복', v);
    case 'st':
      var to = e.to || (G.STATUS[e.s].neg ? 'e' : 's');
      return G.tx(to === 'e' ? '적에게 {0}' : '나에게 {0}', G.T.stCore(e, v));
    case 'cleanse': return e.only ? G.tx('{0} 제거', G.STATUS[e.only].name) : G.tx('나의 해로운 효과 모두 제거');
    case 'self': return G.tx('내 체력 -{0}', v);

// ---- 55_cg.js
// ===== 55_cg: 크레이지게임즈(웹 게임 포털) 판 전용 =====
// node tools/build.js cg 로 만든 판에서만 G.CG = true. 앱·일반 웹에서는 아무것도 하지 않는다.
// 기본 출시(Basic launch) 규칙: 광고·결제 없음 → 광고 보상은 광고 없이 바로 준다 (34_econ G.adFree)
// 진행 저장: 크레이지게임즈 SDK 데이터 모듈 (로그인한 사람은 계정에, 손님은 그 브라우저에 저장됨)
(function () {
  function sdk() { try { return (G.CG && window.CrazyGames && window.CrazyGames.SDK) || null; } catch (e) { return null; } }
  G.cgSDK = sdk;
  // 부팅 전에 SDK를 켜고 저장소를 데이터 모듈로 바꾼다. SDK가 없거나 6초 안에 안 켜지면 그냥 브라우저 저장으로 시작
  G.cgInit = function (done) {
    var called = false;
    function fin() { if (!called) { called = true; done(); } }
    var guard = setTimeout(fin, 6000);
    var s = sdk();
    if (!s || typeof s.init !== 'function') { clearTimeout(guard); fin(); return; }
    var p;
    try { p = s.init(); } catch (e) { clearTimeout(guard); fin(); return; }
    Promise.resolve(p).then(function () {
      if (called) return; // 이미 브라우저 저장으로 시작했으면 도중에 저장소를 바꾸지 않음
      try {
        var d = s.data;
        if (d && typeof d.getItem === 'function' && typeof d.setItem === 'function') {
          var ls = { get: G.store.get, set: G.store.set };
          G.store.get = function (k) { try { var v = d.getItem(k); return v == null ? null : v; } catch (e) { return ls.get(k); } };
          G.store.set = function (k, v) { try { d.setItem(k, v); } catch (e) { ls.set(k, v); } };
          G.cgData = true;
        }
      } catch (e) { }
      clearTimeout(guard); fin();
    }, function () { clearTimeout(guard); fin(); });
  };
  // 플레이 중/아님을 SDK에 알림 (모험 화면에서 팝업 없이 진행 중일 때만 '플레이 중')
  var playing = false;
  G.cgPlay = function (on) {
    var s = sdk(); if (!s || on === playing) return;
    playing = on;
    try { if (on) s.game.gameplayStart(); else s.game.gameplayStop(); } catch (e) { }
  };
  var UI = G.UI;
  if (UI && UI.render) {
    var render0 = UI.render;
    UI.render = function () {
      var x = render0.apply(this, arguments);
      if (G.CG) { var r = UI.run; G.cgPlay(UI.scr === 'run' && !!r && r.phase !== 'dead' && r.phase !== 'retired' && r.phase !== 'victory' && !UI.ov); }
      return x;
    };
  }
  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', function () { if (G.CG && document.hidden) G.cgPlay(false); });
})();

// 원스토어 H5 Game SDK v1.1.0 (https://onestore-dev.gitbook.io/dev/tools/web-sdk)

(function () {
  var sdk = null, adsOk = false;

  G.owSDK = function () { return G.OW ? sdk : null; };
  // 리워드 광고를 쓸 수 있는가 (광고 ID 가 있고, 이 원스토어 앱 버전이 리워드를 지원)
  G.owAds = function () { return !!(G.OW && sdk && adsOk && conf().reward && conf().server); };

  G.owInit = function (done) {
    var called = false;
    function fin() { if (!called) { called = true; try { done(); } catch (e) { } } }
    sdk = window.__OSSDK || null;
    if (!sdk) { fin(); return; } // SDK 를 못 받음(일반 브라우저·오프라인) → 그냥 게임만
    var guard = setTimeout(fin, 8000);
    try {
      // 리스너는 initializeAsync 전에
      sdk.on('pause', function () { try { G.SFX.pause(); } catch (e) { } saveNow(); });
      sdk.on('resume', function () { try { G.SFX.resume(); } catch (e) { } });
      sdk.on('exit', function () { saveNow(); }); // 0.5초 안에 동기 저장 (localStorage)
      sdk.onBackPressed(function () { try { return window.gameBack && window.gameBack() === true; } catch (e) { return false; } });
    } catch (e) { }
    sdk.initializeAsync().then(function (info) {
      clearTimeout(guard);
      if (!info || info.err) { sdk = null; fin(); return; } // 미지원 환경(일반 브라우저 등)
      G.owInfo = info;
      try { var sa = info.safeArea || {}; var r = document.documentElement.style; r.paddingTop = (sa.top || 0) + 'px'; r.paddingBottom = (sa.bottom || 0) + 'px'; } catch (e) { }
      try { adsOk = !!(sdk.ads && sdk.ads.isSupported('rewarded')); if (G.owAds()) sdk.ads.loadRewarded({ placementId: conf().reward }); } catch (e) { adsOk = false; }
      try { sdk.setLoadingProgress(100); } catch (e) { }
      fin(); // 게임 화면을 먼저 그려 둔 뒤
      sdk.startGameAsync().catch(function () { }); // 원스토어 로딩 화면 제거
    }, function () { clearTimeout(guard); sdk = null; fin(); });
  };
  function saveNow() { try { if (G.UI && G.UI.meta) G.saveAll(G.UI.meta, G.UI.run); } catch (e) { } }

  function rid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
    var s = ''; for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16); return s;
  }
  // 서버에 '이 광고 보상이 원스토어에서 확인됐나' 물어봄 (콜백이 조금 늦게 올 수 있어 몇 번 다시 물음)
  function checkReward(id, tries, cb) {
    var url = conf().server.replace(/\/+$/, '') + '/onestore/reward/check?id=' + encodeURIComponent(id);
    fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) cb(true); else if (tries > 1) setTimeout(function () { checkReward(id, tries - 1, cb); }, 1500); else cb(false);

  G.owShowReward = function (cb, ui) {

  };
